<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="480" y="48" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="700">つながるまでの 6 段階</text>
<rect x="42" y="84" width="260" height="108" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="172" y="126" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">① 名乗る</text>
<text x="172" y="156" text-anchor="middle" font-size="13" fill="#475569" font-weight="400"><tspan x="172" dy="0">2 人とも、シグナリング</tspan><tspan x="172" dy="18.85">サーバーにつなぐ</tspan></text>
<rect x="350" y="84" width="260" height="108" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="480" y="126" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">② SDP を交換</text>
<text x="480" y="156" text-anchor="middle" font-size="13" fill="#475569" font-weight="400"><tspan x="480" dy="0">「どう話すか」を、</tspan><tspan x="480" dy="18.85">先に決める</tspan></text>
<rect x="658" y="84" width="260" height="108" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="788" y="126" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">③ 候補を集める</text>
<text x="788" y="156" text-anchor="middle" font-size="13" fill="#475569" font-weight="400"><tspan x="788" dy="0">「どこに届けるか」の候補を、</tspan><tspan x="788" dy="18.85">それぞれが集める</tspan></text>
<rect x="42" y="256" width="260" height="108" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="172" y="298" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">④ 候補を交換</text>
<text x="172" y="328" text-anchor="middle" font-size="13" fill="#475569" font-weight="400"><tspan x="172" dy="0">集めた候補を、</tspan><tspan x="172" dy="18.85">相手に渡す</tspan></text>
<rect x="350" y="256" width="260" height="108" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="480" y="298" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">⑤ 試す</text>
<text x="480" y="328" text-anchor="middle" font-size="13" fill="#475569" font-weight="400"><tspan x="480" dy="0">候補の組み合わせを試して、</tspan><tspan x="480" dy="18.85">通る道を探す</tspan></text>
<rect x="658" y="256" width="260" height="108" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="788" y="298" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">⑥ つながった</text>
<text x="788" y="328" text-anchor="middle" font-size="13" fill="#475569" font-weight="400"><tspan x="788" dy="0">通った道で、</tspan><tspan x="788" dy="18.85">データチャネルが開く</tspan></text>
<path d="M308.00 138.00 L344.00 138.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<path d="M616.00 138.00 L652.00 138.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<path d="M788.00 198.00 L788.00 216.00 L788.00 220.00 Q788.00 224.00 784.00 224.00 L176.00 224.00 Q172.00 224.00 172.00 228.00 L172.00 232.00 L172.00 250.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<path d="M308.00 310.00 L344.00 310.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<path d="M616.00 310.00 L652.00 310.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<text x="330" y="408" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">■ サーバーに頼む</text>
<text x="636" y="408" text-anchor="middle" font-size="13" fill="#15803d" font-weight="400">■ 2 人のあいだで決まる</text>
<text x="480" y="446" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">①〜④ は、2 人の位置関係によらず同じ。変わるのは ⑤ の結果だけ</text>
</svg>
