<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DB に入れても、リロードするまで見えない</title>
    <style>
      /* 明暗の 2 組。どちらを使うかは <html data-theme> で決まる（下の script）。
         線や玉の色も JS からこの変数を指すので、切り替えると描いてあるものまで
         変わる。明るい側のアクセントは暗い側より濃くする。白地では、細い線や
         小さな文字が元の明るさのままだと読めない。 */
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --text: #1b1f24;
        --muted: #5b6472;
        --label: #3a4048;
        --surface: #ffffff;
        --chip: #e6e9ee;
        --border: #c9ced6;
        --server: #b45309;
        --stale: #b45309;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #222;
        --text: #fff;
        --muted: #9aa4b2;
        --label: #c7ced8;
        --surface: #2b3038;
        --chip: #2b3038;
        --border: #4a515b;
        --server: #f5a524;
        --stale: #f5a524;
      }
      body {
        margin: 0;
        padding: 16px 18px 18px;
        background: var(--bg);
        color: var(--text);
        font-family: sans-serif;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .url {
        font-family: monospace;
        font-size: 11px;
        color: var(--muted);
        background: var(--chip);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .spacer {
        flex: 1;
      }
      button {
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      /* 図（SVG）は横幅に合わせて縮む。上に重ねるボタンや画面も同じ割合で
         縮めないと、ノードとの位置がずれる。viewBox の 1 を --u として幅から作る。 */
      #stage {
        position: relative;
        max-width: 620px;
        margin: 6px auto 0;
        container-type: inline-size;
        --u: calc(100cqw / 620);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      /* ノードの下（above なら上）に置く HTML。位置は makeStage が % で入れる。 */
      .pin {
        position: absolute;
        display: flex;
        gap: calc(6 * var(--u));
        white-space: nowrap;
        transform: translateX(-50%);
      }
      .pin.above {
        transform: translate(-50%, -100%);
      }
      .pin button {
        font-size: calc(12 * var(--u));
        padding: calc(5 * var(--u)) calc(12 * var(--u));
        border-radius: calc(6 * var(--u));
      }
      .note {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        min-height: 1.5em;
        text-align: center;
      }
      /* 画面はブラウザの上、操作は下。縦に並べて、誰の画面で誰の操作かを
         迷わせない。図と一緒に縮むよう、大きさは --u で持つ。 */
      .screen {
        flex-direction: column;
        align-items: center;
        gap: 0;
        box-sizing: border-box;
        width: calc(170 * var(--u));
        border: 1px solid var(--border);
        border-radius: calc(8 * var(--u));
        padding: calc(6 * var(--u)) calc(10 * var(--u)) calc(8 * var(--u));
        background: var(--surface);
      }
      .who {
        font-size: calc(11 * var(--u));
        color: var(--muted);
      }
      .screen b {
        font-size: calc(14 * var(--u));
        margin-top: calc(2 * var(--u));
      }
      .stale {
        color: var(--stale);
      }
    </style>
    <script>
      // 明暗は教材ページに合わせる。埋め込み先の <html data-theme>（Starlight が
      // 入れる）を読む。開いたあとの切り替えは、教材ページの preview-client.js が
      // こちらの data-theme を書き換えて届ける。単体で開いたときは OS の設定に従う。
      (function () {
        let theme = null;
        try {
          if (window.parent !== window) {
            theme = window.parent.document.documentElement.dataset.theme;
          }
        } catch (e) {
          // 別オリジンに埋め込まれていると親は読めない。OS の設定に落とす。
        }
        document.documentElement.dataset.theme =
          theme ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div class="head">
      <h1>DB に入れても、リロードするまで見えない</h1>
      <span class="url">https:// + DB</span>
    </div>
    <div id="stage">
      <div class="pin above screen" data-node="a">
        <span class="who">A に見えているもの</span>
        <b id="screen-a">（空）</b>
      </div>
      <div class="pin above screen" data-node="b">
        <span class="who">B に見えているもの</span>
        <b id="screen-b">（空）</b>
      </div>
      <div class="pin" data-node="a">
        <button id="write-a">書きこむ</button>
        <button id="reload-a">リロードする</button>
      </div>
      <div class="pin" data-node="b">
        <button id="write-b">書きこむ</button>
        <button id="reload-b">リロードする</button>
      </div>
    </div>
    <p class="note" id="note">
      4 つのボタンを、いろいろな順で押してみてください
    </p>

    <script>
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const SERVER = 'var(--server)';

      // 色は CSS 変数（var(--server) など）で渡す。確実に CSS として解釈させる
      // ため、fill / stroke だけは属性ではなく style に入れる。
      function svgEl(name, attrs) {
        const node = document.createElementNS(SVG_NS, name);
        for (const key in attrs) {
          if (key === 'fill' || key === 'stroke') node.style[key] = attrs[key];
          else node.setAttribute(key, attrs[key]);
        }
        return node;
      }

      const noteEl = document.querySelector('#note');

      function note(text) {
        noteEl.textContent = text;
      }

      /**
       * 「舞台」を作る。ノード（絵文字＋ラベル）を置き、そのあいだに線（wire）を
       * 引いたり、玉（packet）を走らせたりできる。
       */
      function makeStage(host, spec) {
        const svg = svgEl('svg', { viewBox: '0 0 620 ' + spec.height });
        const layers = {};
        // flash は node より下。波紋が絵文字の後ろから湧いて見えるようにする。
        ['box', 'wire', 'flash', 'node', 'packet'].forEach(function (name) {
          layers[name] = svgEl('g', {});
          svg.appendChild(layers[name]);
        });
        host.appendChild(svg);

        const nodes = {};
        spec.nodes.forEach(function (n) {
          const group = svgEl('g', {});
          const face = svgEl('text', {
            x: n.x,
            y: n.y + 10,
            'text-anchor': 'middle',
            'font-size': 28,
          });
          face.textContent = n.emoji;
          const label = svgEl('text', {
            x: n.x,
            y: n.y + 32,
            'text-anchor': 'middle',
            'font-size': 11,
            fill: 'var(--label)',
          });
          label.textContent = n.label;
          group.appendChild(face);
          group.appendChild(label);
          layers.node.appendChild(group);
          nodes[n.id] = { x: n.x, y: n.y, group: group };
        });

        // 図の上に重ねる HTML（ボタンや画面）を、data-node で指したノードの
        // 下（above なら上）に置く。図は横幅に合わせて伸び縮みするので、位置は
        // viewBox に対する % で持つ。
        host.querySelectorAll('[data-node]').forEach(function (el) {
          const n = nodes[el.dataset.node];
          const y = el.classList.contains('above') ? n.y - 26 : n.y + 44;
          el.style.left = (n.x / 620) * 100 + '%';
          el.style.top = (y / spec.height) * 100 + '%';
        });

        // 線の端点。ノードの絵文字に重ならないよう、中心から 24px 離す。
        // 玉（travel）はこれを使わない。玉はノードの中心から出て中心に入る。
        function ends(a, b) {
          const from = nodes[a];
          const to = nodes[b];
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const len = Math.hypot(dx, dy) || 1;
          const ux = (dx / len) * 24;
          const uy = (dy / len) * 24;
          return {
            x1: from.x + ux,
            y1: from.y + uy,
            x2: to.x - ux,
            y2: to.y - uy,
          };
        }

        return {
          /** 線を 1 本引く。返り値の要素を remove() すれば消える。 */
          wire: function (a, b, options) {
            const p = ends(a, b);
            const line = svgEl('line', {
              x1: p.x1,
              y1: p.y1,
              x2: p.x2,
              y2: p.y2,
              stroke: options.color,
              'stroke-width': options.dashed ? 2 : 3,
              'stroke-linecap': 'round',
            });
            if (options.dashed) line.setAttribute('stroke-dasharray', '5 5');
            layers.wire.appendChild(line);
            return line;
          },

          /** 「届かない」を表す ✕ 印つきの破線。静止画として置きっぱなしにする。 */

          /** a から b へ玉を 1 つ走らせる。届いたら解決する Promise を返す。 */
          travel: function (a, b, options) {
            return new Promise(function (resolve) {
              // 玉は線の端ではなくノードの中心から出し入れする。端から出すと
              // 「何も無い空間から玉が湧いた」ように見え、右のノードが送り手の
              // ときに「右から玉が流れてくる」と誤読される。
              const from = nodes[a];
              const to = nodes[b];
              const color = options.color;
              const dot = svgEl('circle', {
                cx: from.x,
                cy: from.y,
                r: 0,
                fill: color,
              });
              const label = svgEl('text', {
                x: from.x,
                y: from.y - 14,
                'text-anchor': 'middle',
                'font-size': 11,
                fill: color,
                opacity: 0,
              });
              label.textContent = options.label || '';
              // 「ここから出した」の合図。r は絵文字の半径 14 より内側から始めて、
              // 絵文字の後ろから輪が湧き出すようにする（唐突に現れない）。
              const ripple = svgEl('circle', {
                cx: from.x,
                cy: from.y,
                r: 12,
                fill: 'none',
                stroke: color,
                'stroke-width': 2,
                opacity: 0,
              });
              layers.flash.appendChild(ripple);
              layers.packet.appendChild(dot);
              if (options.label) layers.packet.appendChild(label);

              const duration = options.duration || 800;
              const started = performance.now();
              function step(now) {
                // rAF が渡す now は「このフレームが始まった時刻」なので、
                // started より数ミリ秒だけ前になることがある。挟まないと t が
                // 負になり、r に負の値を入れて SVG がエラーを吐く。
                const t = Math.max(0, Math.min(1, (now - started) / duration));
                // easeInOutQuad。等速より「送った → 届いた」に見える。
                const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                const x = from.x + (to.x - from.x) * e;
                const y = from.y + (to.y - from.y) * e;
                dot.setAttribute('cx', x);
                dot.setAttribute('cy', y);
                label.setAttribute('x', x);
                label.setAttribute('y', y - 14);
                // 最初と最後の 15%（800ms なら 120ms ずつ）で半径を 0 ↔ 7 に動かし、
                // ノードから生まれて、ノードに吸い込まれて消えるように見せる。
                // 位置の e ではなく t で測るのは、e が端でわざと遅いから。e で 15%
                // は t の 27%（219ms）にあたり、出足がもたついて見える。
                const scale = Math.min(1, t / 0.15, (1 - t) / 0.15);
                dot.setAttribute('r', 7 * scale);
                // 波紋とラベルは 0.3 で測る。t=0.3 は中心から約 40px、絵文字（14）
                // も線の始点（24）も越えた先。ラベルが絵文字と喧嘩しない。
                const away = Math.min(1, t / 0.3);
                ripple.setAttribute('r', 12 + 14 * away);
                ripple.setAttribute('opacity', 0.7 * (1 - away));
                label.setAttribute('opacity', Math.min(away, (1 - t) / 0.3));
                if (t < 1) {
                  requestAnimationFrame(step);
                } else {
                  ripple.remove();
                  dot.remove();
                  label.remove();
                  resolve();
                }
              }
              requestAnimationFrame(step);
            });
          },
        };
      }

      const stage = makeStage(document.querySelector('#stage'), {
        height: 200,
        nodes: [
          { id: 'a', x: 120, y: 110, emoji: '💻', label: 'ブラウザ A' },
          { id: 's', x: 310, y: 110, emoji: '🗄️', label: 'サーバー + DB' },
          { id: 'b', x: 500, y: 110, emoji: '💻', label: 'ブラウザ B' },
        ],
      });

      const screenA = document.querySelector('#screen-a');
      const screenB = document.querySelector('#screen-b');
      const buttons = Array.prototype.slice.call(
        document.querySelectorAll('button'),
      );

      // DB に入っている値と、A / B がそれぞれ最後に受け取った値。
      // 手元の値と DB がズレているあいだが、
      // 「保存はされているのに、まだ見えていない」状態。
      let stored = null;
      const seen = { a: null, b: null };
      const words = {
        a: ['こんにちは', 'ここに線を引いた', 'あとで消しておいて'],
        b: ['やあ', '丸を描いておいた', '消していいよ'],
      };
      const next = { a: 0, b: 0 };

      function name(who) {
        return who === 'a' ? 'A' : 'B';
      }

      function other(who) {
        return who === 'a' ? 'b' : 'a';
      }

      // 玉が走っているあいだは、どのボタンも押させない。
      function setBusy(on) {
        buttons.forEach(function (button) {
          button.disabled = on;
        });
      }

      function render() {
        [
          ['a', screenA],
          ['b', screenB],
        ].forEach(function (pair) {
          const value = seen[pair[0]];
          pair[1].textContent = value === null ? '（空）' : value;
          // 手元の値が DB と違う＝古い。オレンジで出す。
          pair[1].className = value === stored ? '' : 'stale';
        });
      }

      async function write(who) {
        setBusy(true);
        const list = words[who];
        const word = list[next[who] % list.length];
        next[who] += 1;
        note(name(who) + ' → サーバー');
        await stage.travel(who, 's', { color: SERVER, label: word });
        stored = word;
        // 書いた本人の画面には、送った内容がそのまま出ている。
        seen[who] = word;
        render();
        note(
          seen[other(who)] === stored
            ? 'DB には保存された。' +
                name(other(who)) +
                ' はたまたま同じ内容を持っている'
            : 'DB には保存された。それでも ' +
                name(other(who)) +
                ' の画面（オレンジ）は古いまま',
        );
        setBusy(false);
      }

      async function reload(who) {
        setBusy(true);
        note(name(who) + ' → サーバー（もう一度ください）');
        const line = stage.wire(who, 's', { color: SERVER });
        await stage.travel(who, 's', { color: SERVER, label: 'ください' });
        await stage.travel('s', who, {
          color: SERVER,
          label: stored || '（空）',
        });
        line.remove();
        const wasStale = seen[who] !== stored;
        seen[who] = stored;
        render();
        note(
          stored === null
            ? 'まだ何も書かれていない。それでも 1 往復ぶんの通信はした'
            : wasStale
              ? 'ここではじめて見えた。届いたのは「聞いたから」であって、書かれたからではない'
              : 'すでに持っている内容が、もう一度届いただけ',
        );
        setBusy(false);
      }

      document.querySelector('#write-a').addEventListener('click', function () {
        write('a');
      });
      document.querySelector('#write-b').addEventListener('click', function () {
        write('b');
      });
      document
        .querySelector('#reload-a')
        .addEventListener('click', function () {
          reload('a');
        });
      document
        .querySelector('#reload-b')
        .addEventListener('click', function () {
          reload('b');
        });
    </script>
  </body>
</html>
