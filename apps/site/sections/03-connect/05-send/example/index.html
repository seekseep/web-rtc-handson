<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>色を送る</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <button id="host">へやをつくる</button>
      <button id="guest">へやにはいる</button>
      <p id="status">まだつながっていません</p>
    </header>

    <main>
      <div>
        <div class="circle" id="my-circle"></div>
        <p>じぶん</p>
      </div>
      <div>
        <div class="circle" id="peer-circle"></div>
        <p>あいて</p>
      </div>
    </main>

    <button id="light">ひからせる</button>
  </body>
</html>
