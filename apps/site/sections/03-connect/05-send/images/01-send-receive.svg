<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
<text x="450" y="46" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="700">同じ出来事を、2 つの画面がそれぞれの立場で描く</text>
<rect x="50" y="84" width="350" height="220" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="225" y="116" text-anchor="middle" font-size="21" fill="#1d4ed8" font-weight="700">押した人の画面</text>
<ellipse cx="140" cy="190" rx="38" ry="38" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="140" y="250" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">自分</text>
<ellipse cx="300" cy="190" rx="38" ry="38" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3.5"/>
<text x="300" y="250" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">相手</text>
<text x="225" y="288" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">自分の丸が光る</text>
<rect x="500" y="84" width="350" height="220" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="675" y="116" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">受け取った人の画面</text>
<ellipse cx="590" cy="190" rx="38" ry="38" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3.5"/>
<text x="590" y="250" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">自分</text>
<ellipse cx="750" cy="190" rx="38" ry="38" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="750" y="250" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">相手</text>
<text x="675" y="288" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">相手の丸が光る</text>
<path d="M406.00 194.00 L494.00 194.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<text x="450" y="184.05" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="400">{ color }</text>
<text x="450" y="340" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">送っているのは色だけ。どちらの丸に塗るかは受け取った側が決める</text>
</svg>
