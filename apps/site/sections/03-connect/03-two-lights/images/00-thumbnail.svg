<text x="450.0" y="140.0" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">まだ届かない</text>
<text x="450" y="272" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">ボタンを押すと、じぶんの丸だけが光る</text>
