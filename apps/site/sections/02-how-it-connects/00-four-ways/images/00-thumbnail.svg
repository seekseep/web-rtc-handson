<svg xmlns="http://www.w3.org/2000/svg" width="960" height="306" viewBox="0 0 960 306" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="306" fill="#ffffff"/>
<text x="480" y="48" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="700">ブラウザの通信は、4 段階ある</text>
<rect x="29" y="76" width="212" height="206" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3.5"/>
<text x="135" y="108" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">① ローカル</text>
<text x="135" y="218" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">file://</text>
<text x="135" y="254" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">通信しない</text>
<rect x="259" y="76" width="212" height="206" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="365" y="108" text-anchor="middle" font-size="21" fill="#1d4ed8" font-weight="700">② サーバー</text>
<text x="365" y="218" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">https://</text>
<text x="365" y="254" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">もらって終わり</text>
<rect x="489" y="76" width="212" height="206" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="595" y="108" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">③ WebSocket</text>
<text x="595" y="218" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">wss://</text>
<text x="595" y="254" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">サーバーが配る</text>
<rect x="719" y="76" width="212" height="206" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="825" y="108" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">④ P2P</text>
<text x="825" y="218" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">（URL なし）</text>
<text x="825" y="254" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">直接つながる</text>
