<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4 つのつなぎ方を動かして見る</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 14px 16px 18px;
        background: #222;
        color: #fff;
        font-family: sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
        color: #c7ced8;
      }
      .row {
        border-top: 1px solid #3a3f47;
        padding: 10px 0 4px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .badge {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #222;
        flex: none;
      }
      .name {
        font-size: 13px;
        font-weight: 600;
      }
      .url {
        font-family: monospace;
        font-size: 11px;
        color: #9aa4b2;
        background: #2b3038;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .spacer {
        flex: 1;
      }
      button {
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid #4a515b;
        background: #2b3038;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      svg {
        display: block;
        width: 100%;
        max-width: 620px;
        height: auto;
        margin: 2px auto 0;
      }
      .note {
        margin: 0;
        font-size: 12px;
        color: #9aa4b2;
        min-height: 1.5em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>4 つのつなぎ方を、動かして見くらべる</h1>

    <section class="row" id="row-local">
      <div class="head">
        <span class="badge" style="background: #9aa4b2">1</span>
        <span class="name">ローカルのファイルを開く</span>
        <span class="url">file://</span>
        <span class="spacer"></span>
        <button data-act="open">ファイルを開く</button>
      </div>
      <div class="stage"></div>
      <p class="note">押すと、パソコンの中だけで何が起きるかが見えます</p>
    </section>

    <section class="row" id="row-http">
      <div class="head">
        <span class="badge" style="background: #60a5fa">2</span>
        <span class="name">サーバーに置いたファイルを開く</span>
        <span class="url">https://</span>
        <span class="spacer"></span>
        <button data-act="open">2 台とも開く</button>
      </div>
      <div class="stage"></div>
      <p class="note">
        押すと、A と B がそれぞれサーバーからページをもらいます
      </p>
    </section>

    <section class="row" id="row-ws">
      <div class="head">
        <span class="badge" style="background: #f5a524">3</span>
        <span class="name">WebSocket でつなぎっぱなしにする</span>
        <span class="url">wss://</span>
        <span class="spacer"></span>
        <button data-act="connect">つなぐ</button>
        <button data-act="send" disabled>送る</button>
        <button data-act="push" disabled>サーバーから配る</button>
      </div>
      <div class="stage"></div>
      <p class="note">まず「つなぐ」を押してください</p>
    </section>

    <section class="row" id="row-p2p">
      <div class="head">
        <span class="badge" style="background: #17c964">4</span>
        <span class="name">P2P でブラウザ同士を直接つなぐ</span>
        <span class="url">（URL は無い）</span>
        <span class="spacer"></span>
        <button data-act="connect">つなぐ</button>
        <button data-act="send" disabled>送る</button>
      </div>
      <div class="stage"></div>
      <p class="note">まず「つなぐ」を押してください</p>
    </section>

    <script>
      const SVG_NS = 'http://www.w3.org/2000/svg';

      // 経路の色。03-signaling のデモと同じ配色（オレンジ＝サーバー経由 / 緑＝直接）。
      const SERVER = '#f5a524';
      const DIRECT = '#17c964';
      const QUIET = '#8a97a8';

      function svgEl(name, attrs) {
        const node = document.createElementNS(SVG_NS, name);
        for (const key in attrs) node.setAttribute(key, attrs[key]);
        return node;
      }

      function sleep(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      /**
       * 1 行ぶんの「舞台」を作る。ノード（絵文字＋ラベル）を置き、
       * そのあいだに線（wire）を引いたり、玉（packet）を走らせたりできる。
       */
      function makeStage(host, spec) {
        const svg = svgEl('svg', { viewBox: '0 0 620 ' + spec.height });
        const layers = {};
        ['box', 'wire', 'node', 'packet'].forEach(function (name) {
          layers[name] = svgEl('g', {});
          svg.appendChild(layers[name]);
        });
        host.appendChild(svg);

        if (spec.box) {
          const b = spec.box;
          layers.box.appendChild(
            svgEl('rect', {
              x: b.x,
              y: b.y,
              width: b.w,
              height: b.h,
              rx: 12,
              fill: '#282d34',
              stroke: '#4a515b',
              'stroke-dasharray': '6 6',
            }),
          );
          const label = svgEl('text', {
            x: b.x + b.w / 2,
            y: b.y + 18,
            'text-anchor': 'middle',
            'font-size': 11,
            fill: '#9aa4b2',
          });
          label.textContent = b.label;
          layers.box.appendChild(label);
        }

        const nodes = {};
        spec.nodes.forEach(function (n) {
          const group = svgEl('g', {});
          const face = svgEl('text', {
            x: n.x,
            y: n.y + 10,
            'text-anchor': 'middle',
            'font-size': 28,
          });
          face.textContent = n.emoji;
          const label = svgEl('text', {
            x: n.x,
            y: n.y + 32,
            'text-anchor': 'middle',
            'font-size': 11,
            fill: '#c7ced8',
          });
          label.textContent = n.label;
          group.appendChild(face);
          group.appendChild(label);
          layers.node.appendChild(group);
          nodes[n.id] = { x: n.x, y: n.y, group: group };
        });

        // ノードの絵文字に線が重ならないよう、中心から 24px 離した点を端にする。
        function ends(a, b) {
          const from = nodes[a];
          const to = nodes[b];
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const len = Math.hypot(dx, dy) || 1;
          const ux = (dx / len) * 24;
          const uy = (dy / len) * 24;
          return {
            x1: from.x + ux,
            y1: from.y + uy,
            x2: to.x - ux,
            y2: to.y - uy,
          };
        }

        return {
          svg: svg,

          /** ノードを薄くする（もう出番が無い、を表す）。 */
          dim: function (id, on) {
            nodes[id].group.setAttribute('opacity', on ? '0.3' : '1');
          },

          /** 線を 1 本引く。返り値の要素を remove() すれば消える。 */
          wire: function (a, b, options) {
            const p = ends(a, b);
            const line = svgEl('line', {
              x1: p.x1,
              y1: p.y1,
              x2: p.x2,
              y2: p.y2,
              stroke: options.color,
              'stroke-width': options.dashed ? 2 : 3,
              'stroke-linecap': 'round',
            });
            if (options.dashed) line.setAttribute('stroke-dasharray', '5 5');
            layers.wire.appendChild(line);
            return line;
          },

          clearWires: function () {
            layers.wire.textContent = '';
          },

          /** 「届かない」を表す ✕ 印つきの破線。静止画として置きっぱなしにする。 */
          blocked: function (x1, x2, y, text) {
            layers.box.appendChild(
              svgEl('line', {
                x1: x1,
                y1: y,
                x2: x2,
                y2: y,
                stroke: '#4a515b',
                'stroke-width': 2,
                'stroke-dasharray': '5 5',
              }),
            );
            const mark = svgEl('text', {
              x: (x1 + x2) / 2,
              y: y + 5,
              'text-anchor': 'middle',
              'font-size': 16,
              fill: '#ef4444',
            });
            mark.textContent = '✕';
            layers.box.appendChild(mark);
            if (text) {
              const caption = svgEl('text', {
                x: (x1 + x2) / 2,
                y: y + 22,
                'text-anchor': 'middle',
                'font-size': 11,
                fill: '#78828f',
              });
              caption.textContent = text;
              layers.box.appendChild(caption);
            }
          },

          /** a から b へ玉を 1 つ走らせる。届いたら解決する Promise を返す。 */
          travel: function (a, b, options) {
            return new Promise(function (resolve) {
              const p = ends(a, b);
              const color = options.color;
              const dot = svgEl('circle', {
                cx: p.x1,
                cy: p.y1,
                r: 7,
                fill: color,
              });
              const label = svgEl('text', {
                x: p.x1,
                y: p.y1 - 14,
                'text-anchor': 'middle',
                'font-size': 11,
                fill: color,
              });
              label.textContent = options.label || '';
              layers.packet.appendChild(dot);
              if (options.label) layers.packet.appendChild(label);

              const duration = options.duration || 800;
              const started = performance.now();
              function step(now) {
                const t = Math.min(1, (now - started) / duration);
                // easeInOutQuad。等速より「送った → 届いた」に見える。
                const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                const x = p.x1 + (p.x2 - p.x1) * e;
                const y = p.y1 + (p.y2 - p.y1) * e;
                dot.setAttribute('cx', x);
                dot.setAttribute('cy', y);
                label.setAttribute('x', x);
                label.setAttribute('y', y - 14);
                if (t < 1) {
                  requestAnimationFrame(step);
                } else {
                  dot.remove();
                  label.remove();
                  resolve();
                }
              }
              requestAnimationFrame(step);
            });
          },
        };
      }

      /** 1 行ぶんの DOM をまとめて扱うための小道具。 */
      function row(id) {
        const root = document.querySelector('#' + id);
        const noteEl = root.querySelector('.note');
        return {
          stageHost: root.querySelector('.stage'),
          button: function (act) {
            return root.querySelector('[data-act="' + act + '"]');
          },
          note: function (text) {
            noteEl.textContent = text;
          },
        };
      }

      // ── ① ローカルのファイル ────────────────────────────────
      (function () {
        const ui = row('row-local');
        const stage = makeStage(ui.stageHost, {
          height: 112,
          box: { x: 40, y: 10, w: 380, h: 90, label: 'あなたのパソコンの中' },
          nodes: [
            { id: 'file', x: 130, y: 62, emoji: '📄', label: 'index.html' },
            { id: 'browser', x: 330, y: 62, emoji: '🌐', label: 'ブラウザ' },
            {
              id: 'other',
              x: 550,
              y: 62,
              emoji: '🌐',
              label: '相手のブラウザ',
            },
          ],
        });
        stage.blocked(440, 500, 62, '');

        const open = ui.button('open');
        open.addEventListener('click', async function () {
          open.disabled = true;
          ui.note('ファイルを読んでいる…');
          const line = stage.wire('file', 'browser', {
            color: QUIET,
            dashed: true,
          });
          await stage.travel('file', 'browser', {
            color: QUIET,
            label: 'HTML',
          });
          line.remove();
          ui.note('表示できた。ネットワークは 1 バイトも動いていない');
          open.disabled = false;
        });
      })();

      // ── ② サーバーに置いたファイル ──────────────────────────
      (function () {
        const ui = row('row-http');
        const stage = makeStage(ui.stageHost, {
          height: 140,
          nodes: [
            { id: 'a', x: 90, y: 48, emoji: '🌐', label: 'ブラウザ A' },
            { id: 's', x: 310, y: 48, emoji: '🖥️', label: 'サーバー' },
            { id: 'b', x: 530, y: 48, emoji: '🌐', label: 'ブラウザ B' },
          ],
        });

        const open = ui.button('open');
        open.addEventListener('click', async function () {
          open.disabled = true;
          for (const who of ['a', 'b']) {
            const name = who === 'a' ? 'A' : 'B';
            ui.note(name + ' がサーバーにページを取りに行く');
            const line = stage.wire(who, 's', { color: SERVER });
            await stage.travel(who, 's', { color: SERVER, label: 'ください' });
            await stage.travel('s', who, {
              color: SERVER,
              label: 'index.html',
            });
            line.remove();
            ui.note(name + ' に届いた。1 往復で終わり、接続は切れる');
            await sleep(600);
          }
          stage.blocked(130, 490, 106, 'A と B のあいだには何も無い');
          ui.note('2 台とも同じページを持っている。でも、つながってはいない');
          open.disabled = false;
        });
      })();

      // ── ③ WebSocket ──────────────────────────────────────
      (function () {
        const ui = row('row-ws');
        const stage = makeStage(ui.stageHost, {
          height: 100,
          nodes: [
            { id: 'a', x: 90, y: 50, emoji: '🌐', label: 'ブラウザ A' },
            { id: 's', x: 310, y: 50, emoji: '🖥️', label: 'サーバー' },
            { id: 'b', x: 530, y: 50, emoji: '🌐', label: 'ブラウザ B' },
          ],
        });

        const connect = ui.button('connect');
        const send = ui.button('send');
        const push = ui.button('push');
        let connected = false;

        function setBusy(on) {
          send.disabled = on || !connected;
          push.disabled = on || !connected;
          connect.disabled = on;
        }

        connect.addEventListener('click', function () {
          if (connected) {
            stage.clearWires();
            connected = false;
            connect.textContent = 'つなぐ';
            ui.note('切れた。ここから先は、サーバーから知らせることもできない');
          } else {
            stage.wire('a', 's', { color: SERVER });
            stage.wire('s', 'b', { color: SERVER });
            connected = true;
            connect.textContent = '切る';
            ui.note('つなぎっぱなしになった。閉じるまでこの線は残る');
          }
          setBusy(false);
        });

        send.addEventListener('click', async function () {
          setBusy(true);
          ui.note('A → サーバー');
          await stage.travel('a', 's', { color: SERVER, label: 'こんにちは' });
          ui.note('サーバー → B');
          await stage.travel('s', 'b', { color: SERVER, label: 'こんにちは' });
          ui.note('届いた。ただし同じ言葉が、サーバーを 2 回通っている');
          setBusy(false);
        });

        push.addEventListener('click', async function () {
          setBusy(true);
          ui.note('サーバーから、聞かれていないのに送る');
          await Promise.all([
            stage.travel('s', 'a', { color: SERVER, label: 'お知らせ' }),
            stage.travel('s', 'b', { color: SERVER, label: 'お知らせ' }),
          ]);
          ui.note('これが ② との一番の違い。サーバーから送り出せる');
          setBusy(false);
        });
      })();

      // ── ④ P2P ────────────────────────────────────────────
      (function () {
        const ui = row('row-p2p');
        const stage = makeStage(ui.stageHost, {
          height: 132,
          nodes: [
            {
              id: 's',
              x: 310,
              y: 28,
              emoji: '🖥️',
              label: 'シグナリングサーバー',
            },
            { id: 'a', x: 90, y: 92, emoji: '🌐', label: 'ブラウザ A' },
            { id: 'b', x: 530, y: 92, emoji: '🌐', label: 'ブラウザ B' },
          ],
        });

        const connect = ui.button('connect');
        const send = ui.button('send');
        let connected = false;

        connect.addEventListener('click', async function () {
          if (connected) {
            stage.clearWires();
            stage.dim('s', false);
            connected = false;
            send.disabled = true;
            connect.textContent = 'つなぐ';
            ui.note('切った。もう一度つなぐには、またサーバーが要る');
            return;
          }

          connect.disabled = true;
          const toServer = stage.wire('a', 's', {
            color: SERVER,
            dashed: true,
          });
          const toGuest = stage.wire('s', 'b', { color: SERVER, dashed: true });

          ui.note('まずサーバー経由で、お互いの居場所を教え合う');
          await stage.travel('a', 's', { color: SERVER, label: '居場所' });
          await stage.travel('s', 'b', { color: SERVER, label: '居場所' });
          await stage.travel('b', 's', { color: SERVER, label: '居場所' });
          await stage.travel('s', 'a', { color: SERVER, label: '居場所' });

          toServer.remove();
          toGuest.remove();
          stage.dim('s', true);
          stage.wire('a', 'b', { color: DIRECT });
          connected = true;
          connect.textContent = '切る';
          connect.disabled = false;
          send.disabled = false;
          ui.note('つながった。サーバーはもう用済み（薄くなった）');
        });

        send.addEventListener('click', async function () {
          send.disabled = true;
          connect.disabled = true;
          ui.note('A → B');
          await stage.travel('a', 'b', {
            color: DIRECT,
            label: 'こんにちは',
            duration: 1000,
          });
          ui.note('サーバーを通らずに届いた。これが今回作るもの');
          send.disabled = false;
          connect.disabled = false;
        });
      })();
    </script>
  </body>
</html>
