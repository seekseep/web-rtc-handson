<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="310" fill="#ffffff"/>
<text x="480" y="48" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="700">このハンズオンは、4 つ全部を通る</text>
<ellipse cx="130" cy="118" rx="34" ry="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3.5"/>
<text x="130" y="127" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">①</text>
<text x="130" y="194" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">ローカル</text>
<text x="130" y="226" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">index.html を作って開く</text>
<text x="130" y="252" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">03 章のあいだ</text>
<ellipse cx="360" cy="118" rx="34" ry="34" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="360" y="127" text-anchor="middle" font-size="21" fill="#1d4ed8" font-weight="700">②</text>
<text x="360" y="194" text-anchor="middle" font-size="21" fill="#1d4ed8" font-weight="700">サーバー</text>
<text x="360" y="226" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">Netlify に公開する</text>
<text x="360" y="252" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="400">03 章のおわり</text>
<ellipse cx="590" cy="118" rx="34" ry="34" fill="#ffedd5" stroke="#f97316" stroke-width="3.5"/>
<text x="590" y="127" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">③</text>
<text x="590" y="194" text-anchor="middle" font-size="21" fill="#c2410c" font-weight="700">WebSocket</text>
<text x="590" y="226" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">PeerJS Cloud とつながる</text>
<text x="590" y="252" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">気づかないうちに</text>
<ellipse cx="820" cy="118" rx="34" ry="34" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="820" y="127" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">④</text>
<text x="820" y="194" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">P2P</text>
<text x="820" y="226" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">相手のブラウザに直接送る</text>
<text x="820" y="252" text-anchor="middle" font-size="13" fill="#15803d" font-weight="400">03 章 〜 05 章</text>
<line x1="176" y1="118" x2="314" y2="118" stroke="#94a3b8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aRsub)"/>
<line x1="406" y1="118" x2="544" y2="118" stroke="#94a3b8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aRsub)"/>
<line x1="636" y1="118" x2="774" y2="118" stroke="#94a3b8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aRsub)"/>
<text x="480" y="294" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">③ だけは自分では書かない。PeerJS が裏でやっている</text>
