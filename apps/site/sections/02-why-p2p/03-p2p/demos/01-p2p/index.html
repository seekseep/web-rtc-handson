<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P2P でブラウザ同士を直接つなぐ</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px 18px 18px;
        background: #222;
        color: #fff;
        font-family: sans-serif;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .badge {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #222;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .url {
        font-family: monospace;
        font-size: 11px;
        color: #9aa4b2;
        background: #2b3038;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .spacer {
        flex: 1;
      }
      button {
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid #4a515b;
        background: #2b3038;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      svg {
        display: block;
        width: 100%;
        max-width: 620px;
        height: auto;
        margin: 6px auto 0;
      }
      .note {
        margin: 0;
        font-size: 12px;
        color: #9aa4b2;
        min-height: 1.5em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <span class="badge" style="background: #17c964">↔</span>
      <h1>P2P でブラウザ同士を直接つなぐ</h1>
      <span class="url">（URL は無い）</span>
      <span class="spacer"></span>
      <button id="connect">つなぐ</button>
      <button id="send" disabled>送る</button>
    </div>
    <div id="stage"></div>
    <p class="note" id="note">まず「つなぐ」を押してください</p>

    <script>
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const SERVER = '#f5a524';
      const DIRECT = '#17c964';

      function svgEl(name, attrs) {
        const node = document.createElementNS(SVG_NS, name);
        for (const key in attrs) node.setAttribute(key, attrs[key]);
        return node;
      }

      const noteEl = document.querySelector('#note');

      function note(text) {
        noteEl.textContent = text;
      }

      /**
       * 「舞台」を作る。ノード（絵文字＋ラベル）を置き、そのあいだに線（wire）を
       * 引いたり、玉（packet）を走らせたりできる。
       */
      function makeStage(host, spec) {
        const svg = svgEl('svg', { viewBox: '0 0 620 ' + spec.height });
        const layers = {};
        // flash は node より下。波紋が絵文字の後ろから湧いて見えるようにする。
        ['box', 'wire', 'flash', 'node', 'packet'].forEach(function (name) {
          layers[name] = svgEl('g', {});
          svg.appendChild(layers[name]);
        });
        host.appendChild(svg);

        const nodes = {};
        spec.nodes.forEach(function (n) {
          const group = svgEl('g', {});
          const face = svgEl('text', {
            x: n.x,
            y: n.y + 10,
            'text-anchor': 'middle',
            'font-size': 28,
          });
          face.textContent = n.emoji;
          const label = svgEl('text', {
            x: n.x,
            y: n.y + 32,
            'text-anchor': 'middle',
            'font-size': 11,
            fill: '#c7ced8',
          });
          label.textContent = n.label;
          group.appendChild(face);
          group.appendChild(label);
          layers.node.appendChild(group);
          nodes[n.id] = { x: n.x, y: n.y, group: group };
        });

        // 線の端点。ノードの絵文字に重ならないよう、中心から 24px 離す。
        // 玉（travel）はこれを使わない。玉はノードの中心から出て中心に入る。
        function ends(a, b) {
          const from = nodes[a];
          const to = nodes[b];
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const len = Math.hypot(dx, dy) || 1;
          const ux = (dx / len) * 24;
          const uy = (dy / len) * 24;
          return {
            x1: from.x + ux,
            y1: from.y + uy,
            x2: to.x - ux,
            y2: to.y - uy,
          };
        }

        return {
          /** ノードを薄くする（もう出番が無い、を表す）。 */
          dim: function (id, on) {
            nodes[id].group.setAttribute('opacity', on ? '0.3' : '1');
          },

          /** 線を 1 本引く。返り値の要素を remove() すれば消える。 */
          wire: function (a, b, options) {
            const p = ends(a, b);
            const line = svgEl('line', {
              x1: p.x1,
              y1: p.y1,
              x2: p.x2,
              y2: p.y2,
              stroke: options.color,
              'stroke-width': options.dashed ? 2 : 3,
              'stroke-linecap': 'round',
            });
            if (options.dashed) line.setAttribute('stroke-dasharray', '5 5');
            layers.wire.appendChild(line);
            return line;
          },

          clearWires: function () {
            layers.wire.textContent = '';
          },

          /** a から b へ玉を 1 つ走らせる。届いたら解決する Promise を返す。 */
          travel: function (a, b, options) {
            return new Promise(function (resolve) {
              // 玉は線の端ではなくノードの中心から出し入れする。端から出すと
              // 「何も無い空間から玉が湧いた」ように見え、右のノードが送り手の
              // ときに「右から玉が流れてくる」と誤読される。
              const from = nodes[a];
              const to = nodes[b];
              const color = options.color;
              const dot = svgEl('circle', {
                cx: from.x,
                cy: from.y,
                r: 0,
                fill: color,
              });
              const label = svgEl('text', {
                x: from.x,
                y: from.y - 14,
                'text-anchor': 'middle',
                'font-size': 11,
                fill: color,
                opacity: 0,
              });
              label.textContent = options.label || '';
              // 「ここから出した」の合図。r は絵文字の半径 14 より内側から始めて、
              // 絵文字の後ろから輪が湧き出すようにする（唐突に現れない）。
              const ripple = svgEl('circle', {
                cx: from.x,
                cy: from.y,
                r: 12,
                fill: 'none',
                stroke: color,
                'stroke-width': 2,
                opacity: 0,
              });
              layers.flash.appendChild(ripple);
              layers.packet.appendChild(dot);
              if (options.label) layers.packet.appendChild(label);

              const duration = options.duration || 800;
              const started = performance.now();
              function step(now) {
                const t = Math.min(1, (now - started) / duration);
                // easeInOutQuad。等速より「送った → 届いた」に見える。
                const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                const x = from.x + (to.x - from.x) * e;
                const y = from.y + (to.y - from.y) * e;
                dot.setAttribute('cx', x);
                dot.setAttribute('cy', y);
                label.setAttribute('x', x);
                label.setAttribute('y', y - 14);
                // 最初と最後の 15%（800ms なら 120ms ずつ）で半径を 0 ↔ 7 に動かし、
                // ノードから生まれて、ノードに吸い込まれて消えるように見せる。
                // 位置の e ではなく t で測るのは、e が端でわざと遅いから。e で 15%
                // は t の 27%（219ms）にあたり、出足がもたついて見える。
                const scale = Math.min(1, t / 0.15, (1 - t) / 0.15);
                dot.setAttribute('r', 7 * scale);
                // 波紋とラベルは 0.3 で測る。t=0.3 は中心から約 40px、絵文字（14）
                // も線の始点（24）も越えた先。ラベルが絵文字と喧嘩しない。
                const away = Math.min(1, t / 0.3);
                ripple.setAttribute('r', 12 + 14 * away);
                ripple.setAttribute('opacity', 0.7 * (1 - away));
                label.setAttribute('opacity', Math.min(away, (1 - t) / 0.3));
                if (t < 1) {
                  requestAnimationFrame(step);
                } else {
                  ripple.remove();
                  dot.remove();
                  label.remove();
                  resolve();
                }
              }
              requestAnimationFrame(step);
            });
          },
        };
      }

      const stage = makeStage(document.querySelector('#stage'), {
        height: 170,
        nodes: [
          {
            id: 's',
            x: 310,
            y: 40,
            emoji: '🖥️',
            label: 'シグナリングサーバー',
          },
          { id: 'a', x: 90, y: 118, emoji: '🌐', label: 'ブラウザ A' },
          { id: 'b', x: 530, y: 118, emoji: '🌐', label: 'ブラウザ B' },
        ],
      });

      const connect = document.querySelector('#connect');
      const send = document.querySelector('#send');
      let connected = false;

      connect.addEventListener('click', async function () {
        if (connected) {
          stage.clearWires();
          stage.dim('s', false);
          connected = false;
          send.disabled = true;
          connect.textContent = 'つなぐ';
          note('切った。もう一度つなぐには、またサーバーが要る');
          return;
        }

        connect.disabled = true;
        const toServer = stage.wire('a', 's', { color: SERVER, dashed: true });
        const toGuest = stage.wire('s', 'b', { color: SERVER, dashed: true });

        note('まずサーバー経由で、お互いの居場所を教え合う');
        await stage.travel('a', 's', { color: SERVER, label: '居場所' });
        await stage.travel('s', 'b', { color: SERVER, label: '居場所' });
        await stage.travel('b', 's', { color: SERVER, label: '居場所' });
        await stage.travel('s', 'a', { color: SERVER, label: '居場所' });

        toServer.remove();
        toGuest.remove();
        stage.dim('s', true);
        stage.wire('a', 'b', { color: DIRECT });
        connected = true;
        connect.textContent = '切る';
        connect.disabled = false;
        send.disabled = false;
        note('つながった。サーバーはもう用済み（薄くなった）');
      });

      send.addEventListener('click', async function () {
        send.disabled = true;
        connect.disabled = true;
        note('A → B');
        await stage.travel('a', 'b', {
          color: DIRECT,
          label: 'こんにちは',
          duration: 1000,
        });
        note('サーバーを通らずに届いた。これが今回作るもの');
        send.disabled = false;
        connect.disabled = false;
      });
    </script>
  </body>
</html>
