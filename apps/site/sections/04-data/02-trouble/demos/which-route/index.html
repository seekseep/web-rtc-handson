<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>この回線で使える経路を調べる</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: sans-serif;
        background: #222;
        color: #fff;
      }
      button {
        font-size: 16px;
        padding: 10px 18px;
      }
      table {
        margin-top: 16px;
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444;
      }
      th {
        color: #aaa;
        font-weight: normal;
      }
      .ok {
        color: #17c964;
      }
      .ng {
        color: #f5a524;
      }
      .note {
        margin-top: 14px;
        font-size: 13px;
        color: #bbb;
        line-height: 1.7;
      }
      code {
        background: #333;
        padding: 1px 5px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <button id="run">この回線を調べる</button>
    <table>
      <thead>
        <tr>
          <th style="width: 8em">候補の種類</th>
          <th style="width: 6em">結果</th>
          <th>意味</th>
        </tr>
      </thead>
      <tbody id="log"></tbody>
    </table>
    <p class="note">
      住所そのものは伏せて、種類だけを表示しています。<code>srflx</code>
      が出れば STUN が働いていて、たいていの相手とつながります。<br />
      <code>relay</code> は「見つからない」と出るはずです。ここで使っているのは
      PeerJS が既定で持っている TURN
      サーバーですが、そのホスト名は現在存在しません。
    </p>

    <script>
      const log = document.querySelector('#log');
      const runButton = document.querySelector('#run');

      // PeerJS が既定で使っているものと同じ顔ぶれ
      const ICE_SERVERS = [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: [
            'turn:eu-0.turn.peerjs.com:3478',
            'turn:us-0.turn.peerjs.com:3478',
          ],
          username: 'peerjs',
          credential: 'peerjsp',
        },
      ];

      const MEANING = {
        host: 'この端末が直接持っている住所（同じ LAN の中でだけ届く）',
        srflx:
          '外（インターネット）から見たときの自分の住所。STUN が教えてくれた',
        relay: 'TURN サーバーを中継する経路。直接つながらないときの逃げ道',
      };

      function put(type, found) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td><code>' +
          type +
          '</code></td>' +
          '<td class="' +
          (found ? 'ok' : 'ng') +
          '">' +
          (found ? '見つかった' : '見つからない') +
          '</td>' +
          '<td>' +
          MEANING[type] +
          '</td>';
        log.appendChild(tr);
      }

      runButton.addEventListener('click', async function () {
        log.textContent = '';
        runButton.disabled = true;

        const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        // データチャネルを 1 本作らないと、候補集めが始まらない
        pc.createDataChannel('probe');

        const found = new Set();
        pc.onicecandidate = function (event) {
          if (event.candidate && event.candidate.type) {
            found.add(event.candidate.type);
          }
        };

        await pc.setLocalDescription(await pc.createOffer());

        // 候補が出そろうのを待つ（最大 8 秒）
        await new Promise(function (resolve) {
          const timer = setTimeout(resolve, 8000);
          pc.onicegatheringstatechange = function () {
            if (pc.iceGatheringState === 'complete') {
              clearTimeout(timer);
              resolve();
            }
          };
        });

        ['host', 'srflx', 'relay'].forEach(function (type) {
          put(type, found.has(type));
        });

        pc.close();
        runButton.disabled = false;
      });
    </script>
  </body>
</html>
