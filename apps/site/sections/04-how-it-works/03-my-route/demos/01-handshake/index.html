<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>つながるまでの順番を見る</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: sans-serif;
        background: #222;
        color: #fff;
      }
      button {
        font-size: 16px;
        padding: 10px 18px;
      }
      table {
        margin-top: 16px;
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #444;
        vertical-align: top;
      }
      th {
        color: #aaa;
        font-weight: normal;
      }
      td.t {
        font-family: monospace;
        color: #aaa;
        white-space: nowrap;
      }
      .server {
        color: #f5a524;
      }
      .direct {
        color: #17c964;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  </head>
  <body>
    <button id="run">つないでみる</button>
    <table>
      <thead>
        <tr>
          <th style="width: 5em">経過</th>
          <th style="width: 7em">通り道</th>
          <th>できごと</th>
        </tr>
      </thead>
      <tbody id="log"></tbody>
    </table>

    <script>
      const log = document.querySelector('#log');
      const runButton = document.querySelector('#run');
      let start = 0;

      function put(route, text) {
        const tr = document.createElement('tr');
        const ms = Date.now() - start;
        tr.innerHTML =
          '<td class="t">' +
          ms +
          'ms</td><td class="' +
          (route === 'サーバー経由' ? 'server' : 'direct') +
          '">' +
          route +
          '</td><td>' +
          text +
          '</td>';
        log.appendChild(tr);
      }

      runButton.addEventListener('click', function () {
        log.textContent = '';
        start = Date.now();
        runButton.disabled = true;

        const word =
          'webrtc-handson-demo-' + Math.random().toString(36).slice(2, 10);

        const host = new Peer(word);
        put(
          'サーバー経由',
          'ホストが PeerJS Cloud に「' + word + '」と名乗った',
        );

        host.on('open', function () {
          put(
            'サーバー経由',
            'ホストの名前が受理された（ここまで全部サーバー経由）',
          );

          const guest = new Peer();
          guest.on('open', function () {
            put('サーバー経由', 'ゲストにも名前が配られた');

            const conn = guest.connect(word);
            put(
              'サーバー経由',
              'ゲストが「' + word + '」を呼び出す（居場所の交換がはじまる）',
            );

            conn.on('open', function () {
              put('直接', 'つながった。ここから先はサーバーを通らない');
              conn.send({ hello: 'world' });
              put('直接', 'ゲスト → ホスト にデータを送った');
            });
          });

          host.on('connection', function (c) {
            c.on('data', function (data) {
              put('直接', 'ホストが受け取った: ' + JSON.stringify(data));
              put('直接', '完了。PeerJS Cloud はもう関係ない');
              host.destroy();
              guest.destroy();
              runButton.disabled = false;
            });
          });
        });

        host.on('error', function (err) {
          put('サーバー経由', 'エラー: ' + err.type);
          runButton.disabled = false;
        });
      });
    </script>
  </body>
</html>
