<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P2P でブラウザ同士を直接つなぐ</title>
    <style>
      /* 明暗の 2 組。どちらを使うかは <html data-theme> で決まる（下の script）。
         線や玉の色も JS からこの変数を指すので、切り替えると描いてあるものまで
         変わる。明るい側のアクセントは暗い側より濃くする。白地では、細い線や
         小さな文字が元の明るさのままだと読めない。 */
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --text: #1b1f24;
        --muted: #5b6472;
        --label: #3a4048;
        --surface: #ffffff;
        --chip: #e6e9ee;
        --border: #c9ced6;
        --server: #b45309;
        --direct: #15803d;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #222;
        --text: #fff;
        --muted: #9aa4b2;
        --label: #c7ced8;
        --surface: #2b3038;
        --chip: #2b3038;
        --border: #4a515b;
        --server: #f5a524;
        --direct: #17c964;
      }
      body {
        margin: 0;
        padding: 16px 18px 18px;
        background: var(--bg);
        color: var(--text);
        font-family: sans-serif;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .url {
        font-family: monospace;
        font-size: 11px;
        color: var(--muted);
        background: var(--chip);
        padding: 2px 6px;
        border-radius: 4px;
      }
      button {
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      /* 図（SVG）は横幅に合わせて縮む。上に重ねるボタンや画面も同じ割合で
         縮めないと、ノードとの位置がずれる。viewBox の 1 を --u として幅から作る。 */
      #stage {
        position: relative;
        max-width: 620px;
        margin: 6px auto 0;
        container-type: inline-size;
        --u: calc(100cqw / 620);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      /* ノードの下（above なら上）に置く HTML。位置は makeStage が % で入れる。 */
      .pin {
        position: absolute;
        display: flex;
        gap: calc(6 * var(--u));
        white-space: nowrap;
        transform: translateX(-50%);
      }
      .pin.above {
        transform: translate(-50%, -100%);
      }
      .pin button {
        font-size: calc(12 * var(--u));
        padding: calc(5 * var(--u)) calc(12 * var(--u));
        border-radius: calc(6 * var(--u));
      }
      .note {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        min-height: 1.5em;
        text-align: center;
      }
    </style>
    <script>
      // 明暗は教材ページに合わせる。埋め込み先の <html data-theme>（Starlight が
      // 入れる）を読む。開いたあとの切り替えは、教材ページの preview-client.js が
      // こちらの data-theme を書き換えて届ける。単体で開いたときは OS の設定に従う。
      (function () {
        let theme = null;
        try {
          if (window.parent !== window) {
            theme = window.parent.document.documentElement.dataset.theme;
          }
        } catch (e) {
          // 別オリジンに埋め込まれていると親は読めない。OS の設定に落とす。
        }
        document.documentElement.dataset.theme =
          theme ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div class="head">
      <h1>P2P でブラウザ同士を直接つなぐ</h1>
      <span class="url">（URL は無い）</span>
    </div>
    <div id="stage">
      <div class="pin" data-node="a">
        <button id="connect-a">つなぐ</button>
        <button id="send-a">送る</button>
      </div>
      <div class="pin" data-node="b">
        <button id="connect-b">つなぐ</button>
        <button id="send-b">送る</button>
      </div>
    </div>
    <p class="note" id="note">
      A と B、両方の「つなぐ」を押してください。そろったら直接つながります
    </p>

    <script>
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const SERVER = 'var(--server)';
      const DIRECT = 'var(--direct)';

      // 色は CSS 変数（var(--server) など）で渡す。確実に CSS として解釈させる
      // ため、fill / stroke だけは属性ではなく style に入れる。
      function svgEl(name, attrs) {
        const node = document.createElementNS(SVG_NS, name);
        for (const key in attrs) {
          if (key === 'fill' || key === 'stroke') node.style[key] = attrs[key];
          else node.setAttribute(key, attrs[key]);
        }
        return node;
      }

      const noteEl = document.querySelector('#note');

      function note(text) {
        noteEl.textContent = text;
      }

      /**
       * 「舞台」を作る。ノード（絵文字＋ラベル）を置き、そのあいだに線（wire）を
       * 引いたり、玉（packet）を走らせたりできる。
       */
      function makeStage(host, spec) {
        const svg = svgEl('svg', { viewBox: '0 0 620 ' + spec.height });
        const layers = {};
        // flash は node より下。波紋が絵文字の後ろから湧いて見えるようにする。
        ['box', 'wire', 'flash', 'node', 'packet'].forEach(function (name) {
          layers[name] = svgEl('g', {});
          svg.appendChild(layers[name]);
        });
        host.appendChild(svg);

        const nodes = {};
        spec.nodes.forEach(function (n) {
          const group = svgEl('g', {});
          const face = svgEl('text', {
            x: n.x,
            y: n.y + 10,
            'text-anchor': 'middle',
            'font-size': 28,
          });
          face.textContent = n.emoji;
          const label = svgEl('text', {
            x: n.x,
            y: n.y + 32,
            'text-anchor': 'middle',
            'font-size': 11,
            fill: 'var(--label)',
          });
          label.textContent = n.label;
          group.appendChild(face);
          group.appendChild(label);
          layers.node.appendChild(group);
          nodes[n.id] = { x: n.x, y: n.y, group: group };
        });

        // 図の上に重ねる HTML（ボタンや画面）を、data-node で指したノードの
        // 下（above なら上）に置く。図は横幅に合わせて伸び縮みするので、位置は
        // viewBox に対する % で持つ。
        host.querySelectorAll('[data-node]').forEach(function (el) {
          const n = nodes[el.dataset.node];
          const y = el.classList.contains('above') ? n.y - 26 : n.y + 44;
          el.style.left = (n.x / 620) * 100 + '%';
          el.style.top = (y / spec.height) * 100 + '%';
        });

        // 線の端点。ノードの絵文字に重ならないよう、中心から 24px 離す。
        // 玉（travel）はこれを使わない。玉はノードの中心から出て中心に入る。
        function ends(a, b) {
          const from = nodes[a];
          const to = nodes[b];
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const len = Math.hypot(dx, dy) || 1;
          const ux = (dx / len) * 24;
          const uy = (dy / len) * 24;
          return {
            x1: from.x + ux,
            y1: from.y + uy,
            x2: to.x - ux,
            y2: to.y - uy,
          };
        }

        return {
          /** ノードを薄くする（もう出番が無い、を表す）。 */
          dim: function (id, on) {
            nodes[id].group.setAttribute('opacity', on ? '0.3' : '1');
          },

          /** 線を 1 本引く。返り値の要素を remove() すれば消える。 */
          wire: function (a, b, options) {
            const p = ends(a, b);
            const line = svgEl('line', {
              x1: p.x1,
              y1: p.y1,
              x2: p.x2,
              y2: p.y2,
              stroke: options.color,
              'stroke-width': options.dashed ? 2 : 3,
              'stroke-linecap': 'round',
            });
            if (options.dashed) line.setAttribute('stroke-dasharray', '5 5');
            layers.wire.appendChild(line);
            return line;
          },


          /** a から b へ玉を 1 つ走らせる。届いたら解決する Promise を返す。 */
          travel: function (a, b, options) {
            return new Promise(function (resolve) {
              // 玉は線の端ではなくノードの中心から出し入れする。端から出すと
              // 「何も無い空間から玉が湧いた」ように見え、右のノードが送り手の
              // ときに「右から玉が流れてくる」と誤読される。
              const from = nodes[a];
              const to = nodes[b];
              const color = options.color;
              const dot = svgEl('circle', {
                cx: from.x,
                cy: from.y,
                r: 0,
                fill: color,
              });
              const label = svgEl('text', {
                x: from.x,
                y: from.y - 14,
                'text-anchor': 'middle',
                'font-size': 11,
                fill: color,
                opacity: 0,
              });
              label.textContent = options.label || '';
              // 「ここから出した」の合図。r は絵文字の半径 14 より内側から始めて、
              // 絵文字の後ろから輪が湧き出すようにする（唐突に現れない）。
              const ripple = svgEl('circle', {
                cx: from.x,
                cy: from.y,
                r: 12,
                fill: 'none',
                stroke: color,
                'stroke-width': 2,
                opacity: 0,
              });
              layers.flash.appendChild(ripple);
              layers.packet.appendChild(dot);
              if (options.label) layers.packet.appendChild(label);

              const duration = options.duration || 800;
              const started = performance.now();
              function step(now) {
                // rAF が渡す now は「このフレームが始まった時刻」なので、
                // started より数ミリ秒だけ前になることがある。挟まないと t が
                // 負になり、r に負の値を入れて SVG がエラーを吐く。
                const t = Math.max(0, Math.min(1, (now - started) / duration));
                // easeInOutQuad。等速より「送った → 届いた」に見える。
                const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                const x = from.x + (to.x - from.x) * e;
                const y = from.y + (to.y - from.y) * e;
                dot.setAttribute('cx', x);
                dot.setAttribute('cy', y);
                label.setAttribute('x', x);
                label.setAttribute('y', y - 14);
                // 最初と最後の 15%（800ms なら 120ms ずつ）で半径を 0 ↔ 7 に動かし、
                // ノードから生まれて、ノードに吸い込まれて消えるように見せる。
                // 位置の e ではなく t で測るのは、e が端でわざと遅いから。e で 15%
                // は t の 27%（219ms）にあたり、出足がもたついて見える。
                const scale = Math.min(1, t / 0.15, (1 - t) / 0.15);
                dot.setAttribute('r', 7 * scale);
                // 波紋とラベルは 0.3 で測る。t=0.3 は中心から約 40px、絵文字（14）
                // も線の始点（24）も越えた先。ラベルが絵文字と喧嘩しない。
                const away = Math.min(1, t / 0.3);
                ripple.setAttribute('r', 12 + 14 * away);
                ripple.setAttribute('opacity', 0.7 * (1 - away));
                label.setAttribute('opacity', Math.min(away, (1 - t) / 0.3));
                if (t < 1) {
                  requestAnimationFrame(step);
                } else {
                  ripple.remove();
                  dot.remove();
                  label.remove();
                  resolve();
                }
              }
              requestAnimationFrame(step);
            });
          },
        };
      }

      const stage = makeStage(document.querySelector('#stage'), {
        height: 210,
        nodes: [
          {
            id: 's',
            x: 310,
            y: 40,
            emoji: '🗄️',
            label: 'シグナリングサーバー',
          },
          { id: 'a', x: 90, y: 118, emoji: '💻', label: 'ブラウザ A' },
          { id: 'b', x: 530, y: 118, emoji: '💻', label: 'ブラウザ B' },
        ],
      });

      const buttons = {
        a: {
          connect: document.querySelector('#connect-a'),
          send: document.querySelector('#send-a'),
        },
        b: {
          connect: document.querySelector('#connect-b'),
          send: document.querySelector('#send-b'),
        },
      };
      // joined は「つなぐ」を押したかどうか。相手を待っているあいだは、
      // サーバーへの破線（serverLines）だけがある。2 台そろうと破線を外して、
      // 直接の線（directLine）に張り替える。
      const joined = { a: false, b: false };
      const serverLines = { a: null, b: null };
      let directLine = null;
      let busy = false;

      function name(who) {
        return who === 'a' ? 'A' : 'B';
      }

      function other(who) {
        return who === 'a' ? 'b' : 'a';
      }

      // 押せる条件は 2 つ。玉が走っているあいだは押させない。「送る」は、
      // 直接つながるまで押させない。直接の線は、先にサーバー経由の手続きを
      // 踏まないと張れない。その順番を、押せるかどうかで見せる。
      function syncButtons() {
        ['a', 'b'].forEach(function (who) {
          buttons[who].connect.disabled = busy;
          buttons[who].connect.textContent = joined[who] ? '切る' : 'つなぐ';
          buttons[who].send.disabled = busy || !directLine;
        });
      }

      function setBusy(on) {
        busy = on;
        syncButtons();
      }

      function waitAtServer(who) {
        serverLines[who] = stage.wire(who, 's', { color: SERVER, dashed: true });
      }

      /** 2 台そろったら、サーバー経由で居場所を教え合い、直接の線に張り替える。 */
      async function join(who) {
        joined[who] = true;
        waitAtServer(who);
        const peer = other(who);
        if (!joined[peer]) {
          note(name(who) + ' がサーバーにつないだ。相手が来るのを待っている');
          return;
        }

        // あとから来た側が、先に待っていた側へ声をかける。
        note('そろった。サーバー経由で、お互いの居場所を教え合う');
        await stage.travel(who, 's', { color: SERVER, label: '居場所' });
        await stage.travel('s', peer, { color: SERVER, label: '居場所' });
        await stage.travel(peer, 's', { color: SERVER, label: '居場所' });
        await stage.travel('s', who, { color: SERVER, label: '居場所' });

        serverLines.a.remove();
        serverLines.b.remove();
        serverLines.a = null;
        serverLines.b = null;
        stage.dim('s', true);
        directLine = stage.wire('a', 'b', { color: DIRECT });
        note('つながった。サーバーはもう用済み（薄くなった）');
      }

      function leave(who) {
        joined[who] = false;
        if (directLine) {
          directLine.remove();
          directLine = null;
          stage.dim('s', false);
          // 残った側は、サーバーにつないだまま次の相手を待つ。
          waitAtServer(other(who));
          note(name(who) + ' が切った。もう一度つなぐには、またサーバーが要る');
        } else {
          serverLines[who].remove();
          serverLines[who] = null;
          note(name(who) + ' がサーバーから離れた');
        }
      }

      syncButtons();

      async function send(who) {
        setBusy(true);
        const target = other(who);
        note(name(who) + ' → ' + name(target));
        await stage.travel(who, target, {
          color: DIRECT,
          label: 'こんにちは',
          duration: 1000,
        });
        note('サーバーを通らずに届いた。これが今回作るもの');
        setBusy(false);
      }

      ['a', 'b'].forEach(function (who) {
        buttons[who].connect.addEventListener('click', async function () {
          setBusy(true);
          if (joined[who]) leave(who);
          else await join(who);
          setBusy(false);
        });
        buttons[who].send.addEventListener('click', function () {
          send(who);
        });
      });
    </script>
  </body>
</html>
