<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>つながるまでの手順を 1 ステップずつ見る</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 14px 10px;
        background: #1b1e24;
        color: #e6e9ee;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Sans',
          'Noto Sans JP',
          sans-serif;
        font-size: 13px;
        line-height: 1.7;
      }

      /* 上のタブ = 2 人の位置関係。3 つのケースを別々に操作する。 */
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tab {
        appearance: none;
        font-family: inherit;
        font-size: 12.5px;
        padding: 6px 14px;
        border: 1px solid #3a4048;
        border-radius: 999px;
        background: #23272e;
        color: #aeb6c2;
        cursor: pointer;
      }
      .tab:hover {
        background: #2b3038;
      }
      .tab.is-active {
        background: #f5a524;
        border-color: #f5a524;
        color: #1b1e24;
        font-weight: 700;
      }
      .headline {
        margin: 9px 2px 6px;
        color: #aeb6c2;
        font-size: 12.5px;
      }

      /* 図。狭い画面では縮めずに横スクロールさせる（文字が潰れないように）。 */
      .stage-wrap {
        overflow-x: auto;
        border: 1px solid #2c313a;
        border-radius: 8px;
        background: #15181d;
      }
      .stage {
        display: block;
        width: 100%;
        min-width: 660px;
        height: auto;
      }

      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin: 7px 2px 10px;
        font-size: 11.5px;
        color: #99a1ad;
      }
      .legend b {
        font-weight: normal;
        color: #99a1ad;
      }
      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }

      /* シークバー。上にフェーズ（手続きのまとまり）を同じ幅で並べる。 */
      .phases {
        display: flex;
        gap: 2px;
        margin: 0 0 4px;
      }
      .phase {
        appearance: none;
        font-family: inherit;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 3px 4px;
        border: 0;
        border-bottom: 3px solid #363c45;
        background: transparent;
        color: #79818d;
        font-size: 11px;
        cursor: pointer;
      }
      .phase.is-active {
        color: #fff;
        border-bottom-color: #f5a524;
      }
      .seek {
        display: block;
        width: 100%;
        margin: 0;
        accent-color: #f5a524;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 6px 0 12px;
      }
      .controls button {
        appearance: none;
        font-family: inherit;
        font-size: 12.5px;
        padding: 6px 12px;
        border: 1px solid #3a4048;
        border-radius: 6px;
        background: #23272e;
        color: #e6e9ee;
        cursor: pointer;
      }
      .controls button:hover {
        background: #2b3038;
      }
      .controls .play {
        min-width: 6.5em;
        background: #2f6f4a;
        border-color: #2f6f4a;
        font-weight: 700;
      }
      .counter {
        margin-left: auto;
        color: #99a1ad;
        font-size: 12px;
      }

      /* 下の説明パネル。「いま何をしているか」と「実際に流れているデータ」。 */
      .panel {
        border: 1px solid #2c313a;
        border-radius: 8px;
        background: #21252c;
        padding: 10px 12px 12px;
      }
      .panel__route {
        margin: 0;
        font-size: 11.5px;
        color: #99a1ad;
      }
      .panel__title {
        margin: 2px 0 4px;
        font-size: 14.5px;
        line-height: 1.5;
      }
      .panel__plain {
        margin: 0 0 8px;
        min-height: 2.9em; /* 1 行と 2 行で下が動かないように */
        font-size: 12.5px;
        color: #c3cad4;
      }
      .panel__data-label {
        font-size: 11px;
        color: #79818d;
        margin-bottom: 3px;
      }
      .panel__data pre {
        margin: 0;
        max-height: 126px;
        overflow: auto;
        padding: 8px 10px;
        border-radius: 6px;
        background: #15181d;
        color: #c8d2df;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.6;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="tabs" id="tabs"></div>
    <p class="headline" id="headline"></p>

    <div class="stage-wrap">
      <svg
        class="stage"
        id="stage"
        viewBox="0 0 720 392"
        role="img"
        aria-label="つながるまでの手順の図"
      ></svg>
    </div>
    <div class="legend" id="legend"></div>

    <div class="phases" id="phases"></div>
    <input
      class="seek"
      id="seek"
      type="range"
      min="0"
      max="1000"
      value="0"
      step="1"
      aria-label="どこまで進んだか"
    />
    <div class="controls">
      <button type="button" id="restart">&#8630; 最初から</button>
      <button type="button" id="prev">&#9664; 前へ</button>
      <button type="button" class="play" id="play">&#9654; 再生</button>
      <button type="button" id="next">次へ &#9654;</button>
      <span class="counter" id="counter"></span>
    </div>

    <section class="panel">
      <p class="panel__route" id="route"></p>
      <h2 class="panel__title" id="title"></h2>
      <p class="panel__plain" id="plain"></p>
      <div class="panel__data">
        <div class="panel__data-label">
          このステップで実際に流れているデータ
        </div>
        <pre id="payload"></pre>
      </div>
    </section>

    <script>
      // 「つながるまで」を 1 ステップずつ再生する図。実際に走らせているのではなく、
      // 本物のやりとりを台本にして並べたもの（本物は下の別デモで走らせる）。
      //
      // 3 つのタブ = 2 人の位置関係。位置関係が変わると、通る道と手順が変わる。

      // ---------------- 図の座標（3 つのタブで骨格は共通）----------------

      const NS = 'http://www.w3.org/2000/svg';
      const BROWSER_TOP = 246;

      const NODES = {
        signal: {
          x: 265,
          y: 12,
          w: 190,
          h: 64,
          title: 'シグナリングサーバー',
          sub: 'PeerJS Cloud',
        },
        helper: { x: 284, y: 146, w: 152, h: 44, title: '', sub: '' },
        routerA: {
          x: 76,
          y: 144,
          w: 130,
          h: 64,
          title: 'A の家のルーター',
          sub: 'NAT',
        },
        routerB: {
          x: 514,
          y: 144,
          w: 130,
          h: 64,
          title: 'B の家のルーター',
          sub: 'NAT',
        },
        browserA: { x: 16, y: 246, w: 250, h: 132, title: 'ブラウザ A' },
        browserB: { x: 454, y: 246, w: 250, h: 132, title: 'ブラウザ B' },
      };

      // 線は箱の裏を通す（ルーターの中を通り抜けているように見せる）。
      const WIRES_HOME = {
        aSig: [
          [141, BROWSER_TOP],
          [141, 96],
          [310, 96],
          [310, 76],
        ],
        bSig: [
          [579, BROWSER_TOP],
          [579, 96],
          [410, 96],
          [410, 76],
        ],
        aHelp: [
          [141, BROWSER_TOP],
          [141, 168],
          [284, 168],
        ],
        bHelp: [
          [579, BROWSER_TOP],
          [579, 168],
          [436, 168],
        ],
        relay: [
          [141, BROWSER_TOP],
          [141, 168],
          [579, 168],
          [579, BROWSER_TOP],
        ],
        direct: [
          [165, BROWSER_TOP],
          [165, 198],
          [555, 198],
          [555, BROWSER_TOP],
        ],
      };

      const WIRES_LAN = {
        aSig: WIRES_HOME.aSig,
        bSig: WIRES_HOME.bSig,
        direct: [
          [266, 312],
          [454, 312],
        ],
      };

      const COLORS = {
        signal: '#f5a524', // サーバーを通る
        help: '#5aa9ff', // 住所を教えてもらう
        probe: '#f7d154', // 試している
        fail: '#f3506b', // 届かなかった
        direct: '#17c964', // 直接
        relay: '#c084fc', // TURN が中継
      };

      // ---------------- 実際に流れているデータ ----------------

      function t() {
        return Array.prototype.slice.call(arguments).join('\n');
      }

      const P = {
        wsA: t(
          'GET wss://0.peerjs.com/peerjs?key=peerjs&id=neko-123&token=8f2c1d',
          'Upgrade: websocket',
          '',
          '（この時点では WebSocket をつなぐだけ。URL の id が「あいことば」）',
        ),
        wsB: t(
          'GET wss://0.peerjs.com/peerjs?key=peerjs&id=tori-456&token=4d90ab',
          'Upgrade: websocket',
          '',
          '（ゲストは名乗らないので、PeerJS がランダムな id を作って登録する）',
        ),
        open: t(
          '{ "type": "OPEN" }',
          '',
          '（「その名前で名簿に載せた」という返事。これが返ってきて',
          '  はじめて peer.on("open") が呼ばれる）',
        ),
        makeOffer: t(
          '（まだ 1 バイトも送っていない。ブラウザの中だけの作業）',
          '',
          'pc = new RTCPeerConnection({ iceServers: [ ... ] })',
          "ch = pc.createDataChannel('dc_9k2m4p')",
          'offer = await pc.createOffer()',
          'await pc.setLocalDescription(offer)   ← ここから住所さがしが始まる',
        ),
        makeAnswer: t(
          '（受け取った offer を読んで、返事を書いている。まだ送っていない）',
          '',
          'await pc.setRemoteDescription(offer)',
          'answer = await pc.createAnswer()',
          'await pc.setLocalDescription(answer)  ← A 側も住所さがしが始まる',
        ),
        offer: t(
          '{',
          '  "type": "OFFER",',
          '  "src": "tori-456",',
          '  "dst": "neko-123",',
          '  "payload": {',
          '    "connectionId": "dc_9k2m4p",',
          '    "type": "data",',
          '    "serialization": "binary",',
          '    "sdp": { "type": "offer", "sdp": "↓ 中身は下 ↓" }',
          '  }',
          '}',
          '',
          '--- sdp の中身（自己紹介文。実際は 1 行ずつ \\r\\n で区切られた文字列）---',
          'v=0',
          'o=- 4611731400430051336 2 IN IP4 127.0.0.1',
          't=0 0',
          'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
          'c=IN IP4 0.0.0.0',
          'a=ice-ufrag:9cQ2                 ← 合言葉（疎通確認で使う）',
          'a=ice-pwd:x9cml0YZichV2XlhiMu8g  ← 署名用のパスワード',
          'a=fingerprint:sha-256 4A:AD:B9:...:7C:AB   ← 証明書の指紋',
          'a=setup:actpass',
          'a=sctp-port:5000',
          '',
          '（住所はまだ 1 つも入っていない。ここにあるのは「話し方の取り決め」だけ）',
        ),
        answer: t(
          '{',
          '  "type": "ANSWER",',
          '  "src": "neko-123",',
          '  "dst": "tori-456",',
          '  "payload": {',
          '    "connectionId": "dc_9k2m4p",',
          '    "type": "data",',
          '    "sdp": { "type": "answer", "sdp": "↓ 中身は下 ↓" }',
          '  }',
          '}',
          '',
          '--- sdp の中身（同じ形式の返事）---',
          'v=0',
          'o=- 8912004498231118 2 IN IP4 127.0.0.1',
          't=0 0',
          'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
          'a=ice-ufrag:F7gI',
          'a=ice-pwd:2mQ9dLpAe1sXvKu7RnB0oT',
          'a=fingerprint:sha-256 91:0C:5E:...:1D:9F',
          'a=setup:active                   ← 鍵の交換はこちらから始める',
          'a=sctp-port:5000',
        ),
        forward:
          '（サーバーは中身を読まない。dst に書かれた相手へそのまま渡すだけ）',
        stunAsk: t(
          'STUN Binding Request（20 バイト）',
          '  00 01 00 00                ← 種類: Binding Request',
          '  21 12 A4 42                ← マジッククッキー（STUN の目印）',
          '  6f 5a 2b 91 7c 03 ...      ← やりとりの識別子',
          '',
          '（中身は空っぽ。「私はどこから来ている？」と聞くだけ）',
        ),
        stunAnswerB: t(
          'STUN Binding Success Response',
          '  XOR-MAPPED-ADDRESS = 198.51.100.9 : 41100',
          '',
          '（「あなたはこの住所・この番号から来ているよ」と鏡のように返す。',
          '  ルーターが外向けに使っている住所と番号が、これで分かる）',
        ),
        stunAnswerA: t(
          'STUN Binding Success Response',
          '  XOR-MAPPED-ADDRESS = 203.0.113.7 : 52100',
          '',
          '（A 側にも、外から見た自分の住所が返ってくる）',
        ),
        check: t(
          'STUN Binding Request（サーバーではなく、相手のブラウザに直接）',
          '  USERNAME  = "F7gI:9cQ2"    ← SDP で伝え合った合言葉のペア',
          '  PRIORITY  = 1853824767',
          '  ICE-CONTROLLING',
          '  MESSAGE-INTEGRITY = ...    ← ice-pwd で計算した署名',
          '',
          '（形は STUN と同じ。署名が合わないパケットは無視するので、',
          '  たまたま届いた他人のパケットと取り違えない）',
        ),
        checkOk: t(
          'STUN Binding Success Response',
          '  XOR-MAPPED-ADDRESS = 相手から見たあなたの住所',
          '',
          '（返事が返った = この道は通る。ICE はこの組み合わせを',
          '  「使う経路」に決める。ここでやっと道が 1 本決まった）',
        ),
        dtls: t(
          'DTLS ClientHello        →',
          '                        ←  ServerHello / Certificate',
          'Certificate / Finished  →',
          '                        ←  Finished',
          '',
          '（お互いの証明書の指紋が、SDP で伝え合った a=fingerprint と',
          '  一致するか確かめる。一致してはじめて先へ進む。',
          '  WebRTC は暗号化を切れない。ここは必ず通る）',
        ),
        chOpen: t(
          'SCTP INIT / INIT-ACK / COOKIE-ECHO / COOKIE-ACK',
          'DATA (PPID 50 = DCEP)  03 "dc_9k2m4p"   ← チャネルを開く合図',
          '',
          '（ここで conn.on("open") が呼ばれる。',
          '  ボタンを押したのはずっと前で、送れるようになったのは今）',
        ),
        appData: t(
          'SCTP DATA (PPID 53 = binary)',
          '  83 a4 74 79 70 65 a4 6c 69 6e 65 a2 78 31 64 ...',
          '',
          '（PeerJS が conn.send({ type: "line", x1: 100, ... }) を',
          '  BinaryPack で詰めたもの。相手側で元のオブジェクトに戻る）',
        ),
        turnAllocate: t(
          'TURN Allocate Request',
          '  REQUESTED-TRANSPORT = UDP',
          '  USERNAME  = "1767225600:handson"',
          '  REALM     = "turn.example.net"',
          '  NONCE     = "f9c1a0d3..."',
          '  MESSAGE-INTEGRITY = ...',
          '',
          '（「中継用の住所を 1 つ貸してください」。中継は帯域を食うので、',
          '  TURN はたいてい認証が要る＝無料で転がっていない）',
        ),
        turnAllocated: t(
          'TURN Allocate Success Response',
          '  XOR-RELAYED-ADDRESS = 198.51.100.20 : 49152   ← 借りた住所',
          '  LIFETIME = 600',
          '',
          '（「この住所あての荷物は、あなたに転送します」。',
          '  これで B は、自分の家とは無関係な住所を 1 つ持てた）',
        ),
        turnPermission: t(
          'TURN CreatePermission Request',
          '  XOR-PEER-ADDRESS = 203.0.113.7',
          '',
          '（「A の住所から来た荷物だけ通してください」。',
          '  誰でも中継できると、ただの踏み台になってしまう）',
        ),
        relayCheck: t(
          'A → TURN:  Send Indication',
          '             XOR-PEER-ADDRESS = 198.51.100.9',
          '             DATA = STUN Binding Request（B あて）',
          'TURN → B:  Data Indication として転送',
          '',
          '（A は TURN に「これを B に渡して」と頼む。',
          '  荷物の中身は、さっきと同じ疎通確認のパケット）',
        ),
        relayData: t(
          'A → TURN → B',
          '  ChannelData (channel 0x4000)',
          '    83 a4 74 79 70 65 a4 6c 69 6e 65 ...',
          '',
          '（描いた線 1 本ぶんが、毎回 TURN サーバーを経由する。',
          '  もう P2P ではない。遅くなるし、通信量ぶんの料金もかかる）',
        ),
        nothing: '（このステップでは何も送っていない）',
      };

      // ---------------- ステップの部品（3 つのタブで共通の前半）----------------

      // ①シグナリング接続: 2 つのブラウザが、それぞれシグナリングサーバーに id を登録するだけ。
      function helloSteps() {
        return [
          {
            phase: 'シグナリング接続',
            wire: 'aSig',
            dir: 1,
            kind: 'signal',
            chip: 'WS 接続',
            route: 'ブラウザ A → シグナリングサーバー',
            title: 'ホストが「私は neko-123 です」と名簿に載せてもらう',
            plain:
              'まだ相手は出てこない。まず自分の名前をサーバーに預けるところから始まる。',
            payload: P.wsA,
            set: { aName: 'neko-123', aStatus: '登録中…' },
          },
          {
            phase: 'シグナリング接続',
            wire: 'aSig',
            dir: -1,
            kind: 'signal',
            chip: 'OPEN',
            route: 'シグナリングサーバー → ブラウザ A',
            title: '「その名前で受け付けた」と返ってくる',
            plain:
              '名簿は世界で 1 つしかないので、先に誰かが使っていれば、ここで断られる。',
            payload: P.open,
            set: { aStatus: '名簿に載った' },
          },
          {
            phase: 'シグナリング接続',
            wire: 'bSig',
            dir: 1,
            kind: 'signal',
            chip: 'WS 接続',
            route: 'ブラウザ B → シグナリングサーバー',
            title: 'ゲストも同じサーバーにつなぐ',
            plain:
              'ゲストは名前を決めない。それでも「どこの誰か」を示す id は要るので、自動で振られる。',
            payload: P.wsB,
            set: { bName: 'tori-456（自動）', bStatus: '登録中…' },
          },
          {
            phase: 'シグナリング接続',
            wire: 'bSig',
            dir: -1,
            kind: 'signal',
            chip: 'OPEN',
            route: 'シグナリングサーバー → ブラウザ B',
            title: 'ゲストにも名前が配られた',
            plain:
              'ここまでで「2 人が同じサーバーにいる」だけ。まだ、おたがいの存在すら知らない。',
            payload: P.open,
            set: { bStatus: '名簿に載った' },
          },
        ];
      }

      // ②SDP 交換: 話し方の取り決め（offer / answer）をサーバー越しに 1 往復。候補はまだ入っていない。
      function talkSteps() {
        return [
          {
            phase: 'SDP 交換',
            at: 'browserB',
            kind: 'signal',
            chip: 'offer を書く',
            route: 'ブラウザ B の中',
            title: 'ゲストが peer.connect() を呼び、offer（SDP）を作る',
            plain:
              'peer.connect() を呼んだ瞬間にすること。データの通り道の設計図（offer）を作る。まだ誰にも送っていない。',
            payload: P.makeOffer,
            set: { bStatus: '相手を呼び出す準備' },
            ms: 900,
          },
          {
            phase: 'SDP 交換',
            wire: 'bSig',
            dir: 1,
            kind: 'signal',
            chip: 'OFFER',
            route: 'ブラウザ B → シグナリングサーバー',
            title: '「neko-123 に渡して」と、offer をサーバーに預ける',
            plain:
              'まだ直接の道が無いので、届けてもらうしかない。ここがシグナリングサーバーの仕事。',
            payload: P.offer,
          },
          {
            phase: 'SDP 交換',
            wire: 'aSig',
            dir: -1,
            kind: 'signal',
            chip: 'OFFER',
            route: 'シグナリングサーバー → ブラウザ A',
            title: 'サーバーがそのままホストに渡す',
            plain:
              'サーバーは中身を読まない。宛先だけ見て手渡す、伝言板のような役目。',
            payload: P.offer + '\n\n' + P.forward,

      // 住所（ICE candidate）を 1 通ずつ届けるメッセージ。中身は候補の文字列 1 行だけ。
      function candidateMsg(src, dst, cands, note) {
        const head = t(
          '{',
          '  "type": "CANDIDATE",',
          '  "src": "' + src + '",',
          '  "dst": "' + dst + '",',
          '  "payload": {',
          '    "connectionId": "dc_9k2m4p",',
          '    "type": "data",',
          '    "candidate": {',
          '      "sdpMid": "0",',
          '      "sdpMLineIndex": 0,',
          '      "candidate": "' + cands[0] + '"',
          '    }',
          '  }',
          '}',
        );
        const list = cands
          .map(function (c) {
            return '  ' + c;
          })
          .join('\n');
        return t(
          head,
          '',
          '--- 送る候補（見つかるたびに 1 通ずつ、この形で送る）---',
          list,
          '',
          note,
        );
      }

      // ---------------- 図を組み立てる ----------------

      const stage = document.querySelector('#stage');
      const tabsEl = document.querySelector('#tabs');
      const headlineEl = document.querySelector('#headline');
      const legendEl = document.querySelector('#legend');
      const phasesEl = document.querySelector('#phases');
      const seekEl = document.querySelector('#seek');
      const counterEl = document.querySelector('#counter');
      const routeEl = document.querySelector('#route');
      const titleEl = document.querySelector('#title');
      const plainEl = document.querySelector('#plain');
      const payloadEl = document.querySelector('#payload');
      const playBtn = document.querySelector('#play');

      const WIRE_IDLE = '#39414c';
      const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';

      let sceneWires = {}; // wire 名 -> <path>
      let dyn = {}; // 毎フレーム書き換えるテキスト
      let sigGroup = null; // 用済みになったら薄くする
      let packet, packetBox, packetLabel, pulse, xmark;

      function el(tag, attrs) {
        const node = document.createElementNS(NS, tag);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        return node;
      }

      function txt(x, y, s, attrs) {
        const node = el('text', attrs || {});
        node.setAttribute('x', x);
        node.setAttribute('y', y);
        node.textContent = s;
        return node;
      }

      function dPath(points) {
        return points
          .map(function (p, i) {
            return (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1];
          })
          .join(' ');
      }

      function drawPlainBox(parent, node, title, sub) {
        const g = el('g', {});
        g.appendChild(
          el('rect', {
            x: node.x,
            y: node.y,
            width: node.w,
            height: node.h,
            rx: 9,
            fill: '#262b33',
            stroke: '#4a525e',
            'stroke-width': 1.2,
          }),
        );
        const cx = node.x + node.w / 2;
        g.appendChild(
          txt(cx, node.y + node.h / 2 - (sub ? 2 : -4), title, {
            fill: '#e6e9ee',
            'font-size': 12.5,
            'font-weight': 700,
            'text-anchor': 'middle',
          }),
        );
        if (sub) {
          g.appendChild(
            txt(cx, node.y + node.h / 2 + 14, sub, {
              fill: '#8b93a0',
              'font-size': 10,
              'text-anchor': 'middle',
            }),
          );
        }
        parent.appendChild(g);
        return g;
      }

      // ブラウザの箱だけは中身が動く（名前・住所候補・状態）。
      function drawBrowserBox(parent, node, key, role) {
        const g = el('g', {});
        g.appendChild(
          el('rect', {
            x: node.x,
            y: node.y,
            width: node.w,
            height: node.h,
            rx: 10,
            fill: '#232830',
            stroke: '#4a525e',
            'stroke-width': 1.2,
          }),
        );
        g.appendChild(
          txt(node.x + 14, node.y + 24, node.title + ' ・ ' + role, {
            fill: '#ffffff',
            'font-size': 12.5,
            'font-weight': 700,
          }),
        );
        dyn[key + 'Name'] = txt(node.x + 14, node.y + 42, '', {
          fill: '#9aa4b2',
          'font-size': 11,
        });
        g.appendChild(dyn[key + 'Name']);
        g.appendChild(
          txt(node.x + 14, node.y + 62, '自分の住所（候補）', {
            fill: '#6f7885',
            'font-size': 10,
          }),
        );
        for (let i = 0; i < 3; i++) {
          dyn[key + 'C' + i] = txt(node.x + 20, node.y + 78 + i * 13, '', {
            fill: '#cbd5e1',
            'font-size': 10,
            'font-family': MONO,
          });
          g.appendChild(dyn[key + 'C' + i]);
        }
        dyn[key + 'Status'] = txt(node.x + 14, node.y + 122, '', {
          fill: '#f5a524',
          'font-size': 11,
        });
        g.appendChild(dyn[key + 'Status']);
        parent.appendChild(g);
        return g;
      }

      function drawScene(sc) {
        stage.textContent = '';
        dyn = {};
        sceneWires = {};

        const under = el('g', {});
        const boxes = el('g', {});
        const over = el('g', {});
        stage.appendChild(under);
        stage.appendChild(boxes);
        stage.appendChild(over);

        if (sc.lanBox) {
          boxes.appendChild(
            el('rect', {
              x: 8,
              y: 206,
              width: 704,
              height: 180,
              rx: 12,
              fill: 'none',
              stroke: '#3f4650',
              'stroke-dasharray': '6 5',
            }),
          );
          boxes.appendChild(
            txt(24, 228, '同じ Wi-Fi（家の中の同じネットワーク）', {
              fill: '#79818d',
              'font-size': 11,
            }),
          );
          boxes.appendChild(
            txt(360, 158, '2 台とも同じルーターの内側にいる', {
              fill: '#6f7885',
              'font-size': 11.5,
              'text-anchor': 'middle',
            }),
          );
          boxes.appendChild(
            txt(360, 176, '相手に届けるのに、外へ出る必要がない', {
              fill: '#6f7885',
              'font-size': 11.5,
              'text-anchor': 'middle',
            }),
          );
        }

        // 線は箱より先に描く＝ルーターやサーバーの箱の裏を通り抜けて見える。
        for (const k in sc.wires) {
          const p = el('path', {
            d: dPath(sc.wires[k]),
            fill: 'none',
            stroke: WIRE_IDLE,
            'stroke-width': 2,
            'stroke-dasharray': '5 5',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round',
          });
          under.appendChild(p);
          sceneWires[k] = p;
        }

        sc.boxes.forEach(function (name) {
          const node = NODES[name];
          if (name === 'browserA') {
            drawBrowserBox(boxes, node, 'a', 'ホスト');
          } else if (name === 'browserB') {
            drawBrowserBox(boxes, node, 'b', 'ゲスト');
          } else if (name === 'helper') {
            drawPlainBox(boxes, node, sc.helper.title, sc.helper.sub);
          } else if (name === 'signal') {
            sigGroup = drawPlainBox(boxes, node, node.title, node.sub);
          } else {
            drawPlainBox(boxes, node, node.title, node.sub);
          }
        });

        // 内部作業のときに箱を光らせる枠
        pulse = el('rect', {
          rx: 12,
          fill: 'none',
          'stroke-width': 2,
          opacity: 0,
        });
        over.appendChild(pulse);

        // 届かなかったところに出す ✕
        xmark = el('g', { opacity: 0 });
        xmark.appendChild(
          el('line', {
            x1: -7,
            y1: -7,
            x2: 7,
            y2: 7,
            stroke: COLORS.fail,
            'stroke-width': 3,
            'stroke-linecap': 'round',
          }),
        );
        xmark.appendChild(
          el('line', {
            x1: 7,
            y1: -7,
            x2: -7,
            y2: 7,
            stroke: COLORS.fail,
            'stroke-width': 3,
            'stroke-linecap': 'round',
          }),
        );
        over.appendChild(xmark);

        // 流れているパケット（中身のラベル付き）
        packet = el('g', { opacity: 0 });
        packetBox = el('rect', {
          x: -30,
          y: -11,
          width: 60,
          height: 22,
          rx: 6,
          fill: COLORS.signal,
        });
        packetLabel = txt(0, 0, '', {
          fill: '#12151a',
          'font-size': 11,
          'font-weight': 700,
          'text-anchor': 'middle',
          'dominant-baseline': 'central',
        });
        packet.appendChild(packetBox);
        packet.appendChild(packetLabel);
        over.appendChild(packet);
      }

      // ---------------- 再生 ----------------

      SCENARIOS.forEach(function (sc) {
        let acc = 0;
        sc.durations = sc.steps.map(function (s) {
          return s.ms || 950;
        });
        sc.starts = sc.steps.map(function (s, i) {
          const at = acc;
          acc += sc.durations[i];
          return at;
        });
        sc.total = acc;
      });

      let sIndex = 0;
      let time = 0;
      let playing = false;
      let lastFrame = 0;
      let lastStep = -1;
      const savedTime = SCENARIOS.map(function () {
        return 0;
      });

      function sc() {
        return SCENARIOS[sIndex];
      }

      function locate(tms) {
        const s = sc();
        for (let i = s.steps.length - 1; i >= 0; i--) {
          if (tms >= s.starts[i] || i === 0) {
            const p = Math.max(
              0,
              Math.min(1, (tms - s.starts[i]) / s.durations[i]),
            );
            return { i: i, p: p };
          }
        }
      }

      // ステップの set を積み上げた状態。届いた瞬間（60%）に反映する。
      function stateAt(i, p) {
        const s = sc();
        const st = { aCands: [], bCands: [] };
        for (let k = 0; k <= i; k++) {
          if (k === i && p < 0.6) break;
          const set = s.steps[k].set;
          if (!set) continue;
          for (const key in set) st[key] = set[key];
        }
        return st;
      }

      function ease(p) {
        return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      }

      function paintWires(s, step, state) {
        for (const k in sceneWires) {
          const path = sceneWires[k];
          const lit = state.linkOn && k === s.linkWire;
          path.setAttribute(
            'stroke',
            lit
              ? COLORS[s.linkWire === 'relay' ? 'relay' : 'direct']
              : WIRE_IDLE,
          );
          path.setAttribute('stroke-width', lit ? 2.5 : 2);
          path.setAttribute('stroke-dasharray', lit ? 'none' : '5 5');
          path.setAttribute(
            'opacity',
            state.sigDone && (k === 'aSig' || k === 'bSig') ? 0.25 : 1,
          );
        }
        if (step.wire && sceneWires[step.wire]) {
          const active = sceneWires[step.wire];
          active.setAttribute('stroke', COLORS[step.kind]);
          active.setAttribute('stroke-width', 3);
          active.setAttribute('stroke-dasharray', 'none');
          active.setAttribute('opacity', 1);
        }
        if (sigGroup) {
          sigGroup.setAttribute('opacity', state.sigDone ? 0.3 : 1);
        }
      }

      function paintBoxes(state) {
        dyn.aName.textContent = state.aName
          ? 'あいことば: ' + state.aName
          : 'まだ名乗っていない';
        dyn.bName.textContent = state.bName
          ? 'あいことば: ' + state.bName
          : 'まだ名乗っていない';
        for (let i = 0; i < 3; i++) {
          dyn['aC' + i].textContent =
            state.aCands[i] || (i === 0 ? '（まだ無い）' : '');
          dyn['bC' + i].textContent =
            state.bCands[i] || (i === 0 ? '（まだ無い）' : '');
        }
        dyn.aStatus.textContent = state.aStatus || '';
        dyn.bStatus.textContent = state.bStatus || '';
        const doneColor = state.done ? COLORS.direct : '#f5a524';
        dyn.aStatus.setAttribute('fill', doneColor);
        dyn.bStatus.setAttribute('fill', doneColor);
      }

      function paintPacket(step, p) {
        if (step.wire) {
          const path = sceneWires[step.wire];
          const len = path.getTotalLength();
          const q = step.fail ? Math.min(p / 0.55, 1) * 0.28 : ease(p);
          const at = step.dir === -1 ? len * (1 - q) : len * q;
          const pt = path.getPointAtLength(at);
          packet.setAttribute(
            'transform',
            'translate(' + pt.x + ',' + pt.y + ')',
          );
          packet.setAttribute('opacity', 1);
          pulse.setAttribute('opacity', 0);
          if (step.fail && p > 0.6) {
            xmark.setAttribute(
              'transform',
              'translate(' + pt.x + ',' + (pt.y - 22) + ')',
            );
            xmark.setAttribute('opacity', 1);
          } else {
            xmark.setAttribute('opacity', 0);
          }
          return;
        }
        // 内部作業: 箱の上にラベルを出して、枠を光らせる
        const node = NODES[step.at];
        packet.setAttribute(
          'transform',
          'translate(' + (node.x + node.w / 2) + ',' + (node.y - 12) + ')',
        );
        packet.setAttribute('opacity', 1);
        xmark.setAttribute('opacity', 0);
        const k = (p * 2) % 1;
        const pad = 4 + 8 * k;
        pulse.setAttribute('x', node.x - pad);
        pulse.setAttribute('y', node.y - pad);
        pulse.setAttribute('width', node.w + pad * 2);
        pulse.setAttribute('height', node.h + pad * 2);
        pulse.setAttribute('stroke', COLORS[step.kind]);
        pulse.setAttribute('opacity', 0.75 * (1 - k));
      }

      function paintPanel(step, i) {
        routeEl.textContent = step.route;
        titleEl.textContent = i + 1 + '. ' + step.title;
        plainEl.textContent = step.plain;
        payloadEl.textContent = step.payload || P.nothing;
        packetLabel.textContent = step.chip;
        const w = Math.max(56, packetLabel.getComputedTextLength() + 20);
        packetBox.setAttribute('x', -w / 2);
        packetBox.setAttribute('width', w);
        packetBox.setAttribute('fill', COLORS[step.kind]);
      }

      function paintPhases(s, i) {
        const buttons = phasesEl.children;
        for (let g = 0; g < s.groups.length; g++) {
          const on = i >= s.groups[g].start && i <= s.groups[g].end;
          buttons[g].classList.toggle('is-active', on);
        }
      }

      function render() {
        const s = sc();
        const loc = locate(time);
        const step = s.steps[loc.i];
        const state = stateAt(loc.i, loc.p);

        paintWires(s, step, state);
        paintBoxes(state);
        paintPacket(step, loc.p);
        if (loc.i !== lastStep) {
          paintPanel(step, loc.i);
          paintPhases(s, loc.i);
          lastStep = loc.i;
        }
        counterEl.textContent =
          'ステップ ' +
          (loc.i + 1) +
          ' / ' +
          s.steps.length +
          ' ・ ' +
          step.phase;
        seekEl.value = Math.round(time);
      }

      function setPlaying(on) {
        playing = on;
        playBtn.innerHTML = on ? '&#10073;&#10073; 停止' : '&#9654; 再生';
        if (on) {
          lastFrame = performance.now();
          requestAnimationFrame(tick);
        }
      }

      function tick(now) {
        if (!playing) return;
        const dt = Math.min(now - lastFrame, 80);
        lastFrame = now;
        time += dt;
        if (time >= sc().total) {
          time = sc().total;
          setPlaying(false);
        }
        render();
        if (playing) requestAnimationFrame(tick);
      }

      function seekTo(tms) {
        time = Math.max(0, Math.min(sc().total, tms));
        setPlaying(false);
        render();
      }

      function stepBy(delta) {
        const s = sc();
        const i = locate(time).i;
        // 再生中に押したときは、いま動いているステップの頭に戻すのを 1 回ぶんとして数える
        const atHead = Math.abs(time - s.starts[i]) < 40;
        const next = delta < 0 ? (atHead ? i - 1 : i) : i + 1;
        seekTo(s.starts[Math.max(0, Math.min(s.steps.length - 1, next))]);
      }

      // フェーズ帯の幅は「そのフェーズにかかる時間の比」で決まるので、
      // 短いフェーズには長い名前が入りきらない。入る中でいちばん詳しい名前を使う。
      const PHASE_LABELS = {
        シグナリング接続: ['シグナリング接続', 'シグナリング', 'WS'],
        'SDP 交換': ['SDP 交換', 'SDP'],
        'ICE 候補交換': ['ICE 候補交換', 'ICE 候補', 'ICE'],
        接続性チェック: ['接続性チェック', 'チェック'],
        'TURN 割り当て': ['TURN 割り当て', 'TURN'],
        'DTLS ハンドシェイク': ['DTLS ハンドシェイク', 'DTLS'],
        データチャネル: ['データチャネル', 'データ'],
      };

      // ボタンの scrollWidth は右側の余白を数えないので、文字幅は canvas で測る。
      const fitCanvas = document.createElement('canvas').getContext('2d');

      function fitPhaseLabels() {
        Array.prototype.forEach.call(phasesEl.children, function (b) {
          const names = PHASE_LABELS[b.title] || [b.title];
          b.style.fontSize = '';
          b.style.letterSpacing = '';
          const cs = getComputedStyle(b);
          const avail =
            b.clientWidth -
            parseFloat(cs.paddingLeft) -
            parseFloat(cs.paddingRight);
          const fits = function (name, px) {
            fitCanvas.font = px + 'px ' + cs.fontFamily;
            return fitCanvas.measureText(name).width <= avail;
          };
          const base = parseFloat(cs.fontSize);
          for (let i = 0; i < names.length; i++) {
            if (fits(names[i], base)) {
              b.textContent = names[i];
              return;
            }
          }
          // いちばん短い名前でも入らないときだけ、文字を小さくして詰める
          const last = names[names.length - 1];
          b.textContent = last;
          b.style.fontSize = fits(last, base - 1)
            ? base - 1 + 'px'
            : base - 2 + 'px';
          if (!fits(last, base - 2)) b.style.letterSpacing = '-0.3px';
        });
      }

      function buildPhases(s) {
        phasesEl.textContent = '';
        const groups = [];
        s.steps.forEach(function (st, i) {
          const last = groups[groups.length - 1];
          if (last && last.phase === st.phase) {
            last.ms += s.durations[i];
            last.end = i;
          } else {
            groups.push({
              phase: st.phase,
              ms: s.durations[i],
              start: i,
              end: i,
            });
          }
        });
        s.groups = groups;
        groups.forEach(function (g) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'phase';
          b.textContent = g.phase;
          b.title = g.phase;
          b.style.flex = g.ms + ' 0 0'; // 幅＝そのフェーズにかかる時間の比
          b.addEventListener('click', function () {
            seekTo(s.starts[g.start]);
          });
          phasesEl.appendChild(b);
        });
        fitPhaseLabels();
      }

      function buildLegend(s) {
        legendEl.textContent = '';
        s.legend.forEach(function (item) {
          const span = document.createElement('b');
          const dot = document.createElement('i');
          dot.style.background = COLORS[item[0]];
          span.appendChild(dot);
          span.appendChild(document.createTextNode(item[1]));
          legendEl.appendChild(span);
        });
      }

      function selectScenario(next) {
        savedTime[sIndex] = time;
        sIndex = next;
        time = savedTime[sIndex];
        setPlaying(false);
        lastStep = -1;
        const s = sc();
        Array.prototype.forEach.call(tabsEl.children, function (b, i) {
          b.classList.toggle('is-active', i === sIndex);
        });
        headlineEl.textContent = s.headline;
        seekEl.max = s.total;
        buildPhases(s);
        buildLegend(s);
        drawScene(s);
        render();
      }

      SCENARIOS.forEach(function (s, i) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tab';
        b.textContent = s.tab;
        b.addEventListener('click', function () {
          selectScenario(i);
        });
        tabsEl.appendChild(b);
      });

      window.addEventListener('resize', fitPhaseLabels);

      seekEl.addEventListener('input', function () {
        setPlaying(false);
        time = Number(seekEl.value);
        render();
      });
      playBtn.addEventListener('click', function () {
        if (!playing && time >= sc().total) time = 0;
        setPlaying(!playing);
      });
      document.querySelector('#prev').addEventListener('click', function () {
        stepBy(-1);
      });
      document.querySelector('#next').addEventListener('click', function () {
        stepBy(1);
      });
      document.querySelector('#restart').addEventListener('click', function () {
        seekTo(0);
      });

      selectScenario(0);
    </script>
  </body>
</html>
