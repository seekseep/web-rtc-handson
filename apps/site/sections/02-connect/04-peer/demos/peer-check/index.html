<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PeerJS Cloud につながるか確かめる</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        background: #222;
        color: #fff;
      }
      button {
        font-size: 16px;
        padding: 10px 18px;
      }
      #result {
        margin-top: 20px;
        padding: 16px;
        border-radius: 8px;
        background: #333;
        font-family: monospace;
        word-break: break-all;
        min-height: 24px;
      }
      .ok {
        color: #17c964;
      }
      .ng {
        color: #f5a524;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  </head>
  <body>
    <button id="check">PeerJS Cloud につないでみる</button>
    <div id="result">まだ押していません</div>

    <script>
      const result = document.querySelector('#result');

      document.querySelector('#check').addEventListener('click', function () {
        result.textContent = 'つないでいます…';
        result.className = '';

        // 名前を指定しないと、PeerJS Cloud が空いている名前を 1 つ配ってくれる
        const peer = new Peer();

        peer.on('open', function (id) {
          result.className = 'ok';
          result.textContent = 'つながりました。あなたに配られた名前: ' + id;
          // 確認できたら切っておく
          peer.destroy();
        });

        peer.on('error', function (err) {
          result.className = 'ng';
          result.textContent = 'つながりませんでした: ' + err.type;
        });
      });
    </script>
  </body>
</html>
