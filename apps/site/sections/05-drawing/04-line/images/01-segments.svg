<circle cx="380" cy="150" r="8" fill="#fff" stroke="#1d4ed8" stroke-width="3"/>
<text x="200" y="300" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">last</text>
<text x="290" y="300" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">いまの点</text>
