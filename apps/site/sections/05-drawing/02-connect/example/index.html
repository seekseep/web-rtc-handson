<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キャンバスとスタンプ</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <input id="word" placeholder="あいことば" value="test" />
      <button id="host">へやをつくる</button>
      <button id="guest">へやにはいる</button>
      <span id="status">まだつながっていません</span>
    </header>

    <div class="tools">
      <button class="stamp selected" data-stamp="🐱">🐱</button>
      <button class="stamp" data-stamp="🌸">🌸</button>
      <button class="stamp" data-stamp="⭐">⭐</button>
    </div>

    <div class="stage">
      <canvas id="canvas" width="800" height="600"></canvas>
    </div>
  </body>
</html>
