<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="900" height="320" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="700">指示に入れるのは、その命令に必要な情報だけ</text>
<rect x="70" y="96" width="360" height="160" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="250" y="128" text-anchor="middle" font-size="21" fill="#1d4ed8" font-weight="700" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">line</text>
<text x="250" y="162" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">x1, y1, x2, y2</text>
<text x="250" y="188" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">color, width</text>
<text x="250" y="226" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">どこに・何色で・どの太さで</text>
<rect x="470" y="96" width="360" height="160" rx="16" fill="#fef9c3" stroke="#f59e0b" stroke-width="3.5"/>
<text x="650" y="128" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">clear</text>
<text x="650" y="172" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">（ほかに何もいらない）</text>
<text x="650" y="226" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">「ぜんぶ消して」だけで伝わる</text>
<text x="450" y="296" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">足りないと画面がズレる。多すぎても意味がない。</text>
</svg>
