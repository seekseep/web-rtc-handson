<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="900" height="384" fill="#ffffff"/>
<text x="450" y="50" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="700">「白く塗る」と「消す」は、別のこと</text>
<rect x="50" y="84" width="380" height="240" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3.5"/>
<text x="240" y="122" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">白で塗る</text>
<rect x="90" y="148" width="300" height="116" rx="8" fill="#bfe6ff"/>
<rect x="90" y="214" width="300" height="50" fill="#b7e3a4"/>
<circle cx="338" cy="182" r="20" fill="#ffe08a"/>
<rect x="90" y="148" width="300" height="116" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<path d="M110 236 Q 170 178 228 218 T 326 190" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
<line x1="110" y1="212" x2="370" y2="212" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
<text x="240" y="300" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="400">背景まで白い帯で隠れる</text>
<rect x="470" y="84" width="380" height="240" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="660" y="122" text-anchor="middle" font-size="21" fill="#15803d" font-weight="700">透明にする</text>
<rect x="510" y="148" width="300" height="116" rx="8" fill="#bfe6ff"/>
<rect x="510" y="214" width="300" height="50" fill="#b7e3a4"/>
<circle cx="758" cy="182" r="20" fill="#ffe08a"/>
<rect x="510" y="148" width="300" height="116" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<path d="M530 236 Q 590 178 626 200" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
<path d="M700 202 Q 716 196 746 190" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
<text x="660" y="300" text-anchor="middle" font-size="13" fill="#15803d" font-weight="400">線だけ消えて、背景は残る</text>
<text x="450" y="356" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">背景が白一色でなくなった瞬間に、この違いが表に出る</text>
</svg>
